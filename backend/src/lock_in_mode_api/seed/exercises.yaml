# Lock In Mode exercise library (ADR 0009, fields from ADR 0010, imported per ADR 0011).
#
# Imported from the "Lock In Mode: Exercise Database" sheet (255 exercises). From now on this
# file is the source of truth: change exercises here, not in the sheet (ADR 0011).
# Rules are checked by seed/schema.py and run in CI:
#   slug              lowercase-with-hyphens, never changes once released (it's the key)
#   category          push | pull | legs | core | cardio | mobility
#   movement_slot     the job it does in a workout template (see MovementSlot in models/enums.py)
#   exercise_type     compound | isolation | cardio | mobility
#   primary_muscle    one of: chest, back, shoulders, traps, biceps, triceps, forearms, quads,
#                     hamstrings, glutes, adductors, calves, core. None for cardio; for mobility
#                     it's the muscle being stretched (counts no sets)
#   secondary_muscles same list; a set counts 1 for primary, 0.5 for each secondary
#   targets           heads it emphasises (see MuscleHead); each must belong to a listed muscle
#   equipment         [] = none needed; else dumbbells, resistance_bands, pull_up_bar, gym
#   also_needs        household or gym items in plain words ("Chair", "Barbell, bench")
#   home_only         true for home tricks (backpack row, table row): never shown at the gym
#   difficulty        1 (easiest) .. 5;  effectiveness 1..5 (blank only for mobility)
#   impact            none | low | medium | high;  not_suitable_for: knees, back, shoulders
#   steps             3-5 plain-language steps, cues 2-3, one common_mistake
#   harder            next exercise up: same movement slot, same or higher difficulty
#   alternatives      slugs; write each pair once, the loader stores both directions
#
# Language: someone who has never been to a gym must understand every line.

exercises:

  # ===================================================================================
  # PUSH
  # ===================================================================================

  # --- Horizontal push ---------------------------------------------------------------

  - slug: wall-push-up
    name: Wall push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    also_needs: Wall
    difficulty: 1
    effectiveness: 2
    steps:
      - Stand an arm's length from a wall and put your hands on it at shoulder height.
      - Lean in by bending your elbows until your chest is close to the wall.
      - Push the wall away to come back to the start.
    cues:
      - Keep your body straight from heels to head.
      - Step further back to make it harder.
    common_mistake: Only bending the elbows a little instead of bringing your chest close to the wall.
    harder: incline-push-up

  - slug: incline-push-up
    name: Incline push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_lower, delt_front, triceps_lateral]
    also_needs: Table or chair
    difficulty: 1
    effectiveness: 3
    steps:
      - Place your hands on a sturdy table, bed or wall ledge, a little wider than your shoulders.
      - Step your feet back until your body is in a straight line from heels to head.
      - Bend your elbows and lower your chest towards the edge.
      - Push away to come back up.
    cues:
      - The higher your hands, the easier it gets.
      - Squeeze your stomach and bottom so your body stays straight.
    common_mistake: Using furniture that slides or tips. Check it is steady first.
    harder: knee-push-up

  - slug: knee-push-up
    name: Knee push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    difficulty: 2
    effectiveness: 3
    steps:
      - Kneel on the floor and place your hands a little wider than your shoulders.
      - Walk your hands forward until your body is in a straight line from knees to head.
      - Bend your elbows and lower your chest towards the floor.
      - Push the floor away to come back up.
    cues:
      - Keep your hips in line with your back, not up in the air.
      - Elbows point back at an angle, not straight out to the sides.
    common_mistake: Only moving your head down instead of lowering your whole chest.
    harder: push-up

  - slug: push-up
    name: Push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders, core]
    targets: [chest_mid, delt_front, triceps_lateral]
    difficulty: 3
    effectiveness: 4
    steps:
      - Start on your hands and toes, hands a little wider than your shoulders.
      - Make a straight line from your heels to your head.
      - Bend your elbows and lower your chest until it is close to the floor.
      - Push the floor away to come back up.
    cues:
      - Squeeze your stomach so your hips don't sag.
      - Look at the floor slightly ahead of your hands, not at your feet.
    common_mistake: Letting your hips drop towards the floor, which strains your lower back.
    harder: close-grip-push-up

  - slug: close-grip-push-up
    name: Close-grip push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: triceps
    secondary_muscles: [chest, shoulders]
    targets: [triceps_lateral, triceps_medial, chest_mid]
    difficulty: 3
    effectiveness: 4
    steps:
      - Start in a push-up position with your hands under your chest, a little narrower than your shoulders.
      - Bend your elbows and lower your chest towards your hands.
      - Push the floor away to come back up.
    cues:
      - Elbows brush past your ribs, pointing back.
      - Keep your body in a straight line.
    common_mistake: Letting your elbows flare out to the sides.
    harder: decline-push-up

  - slug: decline-push-up
    name: Decline push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [shoulders, triceps]
    targets: [chest_upper, delt_front, triceps_lateral]
    also_needs: Chair or bench
    difficulty: 4
    effectiveness: 4
    steps:
      - Put your feet on a sturdy step, bed or chair and your hands on the floor.
      - Make a straight line from your heels to your head.
      - Bend your elbows and lower your chest towards the floor.
      - Push the floor away to come back up.
    cues:
      - Start with a low step; the higher your feet, the harder it gets.
      - Keep your stomach tight the whole time.
    common_mistake: Feet on something that slides. Use a surface that stays put.
    harder: archer-push-up

  - slug: archer-push-up
    name: Archer push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    difficulty: 5
    effectiveness: 4
    steps:
      - Start in a push-up position with your hands much wider than your shoulders.
      - Lower your chest towards one hand while the other arm straightens out to the side.
      - Push back up to the middle.
      - Repeat on the other side.
    cues:
      - The bent arm does most of the work; the straight arm only helps.
      - Keep your hips level.
    common_mistake: Twisting your hips instead of keeping your body flat.

  - slug: band-chest-press
    name: Band chest press
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    equipment: [resistance_bands]
    also_needs: Anchor or behind back
    difficulty: 2
    effectiveness: 3
    steps:
      - Wrap the band around your upper back, or tie it behind you at chest height, holding one end in each hand.
      - Start with your hands beside your chest, elbows bent.
      - Push your hands straight forward until your arms are straight.
      - Bring them back slowly.
    cues:
      - Stand in a split stance so the band doesn't pull you backwards.
      - Squeeze your chest at the front.
    common_mistake: Letting the band snap your hands back instead of returning slowly.

  - slug: band-resisted-push-up
    name: Band-resisted push-up
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    equipment: [resistance_bands]
    difficulty: 4
    effectiveness: 4
    steps:
      - Wrap the band across your upper back and hold one end under each hand.
      - Get into a push-up position.
      - Lower your chest towards the floor.
      - Push up hard against the band.
    cues:
      - Keep your body in a straight line.
      - The band is hardest at the top; push all the way.
    common_mistake: Hips sagging as the band adds load.

  - slug: dumbbell-floor-press
    name: Dumbbell floor press
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 3
    steps:
      - Lie on your back on the floor with your knees bent and a dumbbell in each hand.
      - Start with your elbows on the floor and the dumbbells above your chest.
      - Press the dumbbells straight up until your arms are straight.
      - Lower slowly until your upper arms touch the floor.
    cues:
      - Let your elbows touch the floor lightly; don't bounce.
      - Elbows point out at an angle, not straight to the sides.
    common_mistake: Dropping the elbows onto the floor hard.
    harder: dumbbell-bench-press

  - slug: dumbbell-bench-press
    name: Dumbbell bench press
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    equipment: [dumbbells, gym]
    also_needs: Bench
    difficulty: 3
    effectiveness: 5
    steps:
      - Sit on the end of a flat bench with a dumbbell standing on each thigh.
      - Lie back and bring the dumbbells up beside your chest, palms facing your feet.
      - Press both dumbbells up until your arms are straight over your chest.
      - Lower them slowly until they are level with your chest.
      - When you finish, bring the dumbbells back to your thighs and sit up.
    cues:
      - Keep your feet flat and your shoulder blades pressed back into the bench.
      - Elbows point out at an angle, not straight out to the sides.
    common_mistake: Dropping the dumbbells fast and bouncing them at the bottom.
    harder: incline-dumbbell-press

  - slug: incline-dumbbell-press
    name: Incline dumbbell press
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [shoulders, triceps]
    targets: [chest_upper, delt_front, triceps_lateral]
    equipment: [dumbbells, gym]
    also_needs: Adjustable bench
    difficulty: 3
    effectiveness: 5
    steps:
      - Set a bench to a low incline and sit with a dumbbell on each thigh.
      - Lie back and bring the dumbbells beside your upper chest.
      - Press them up until your arms are straight above your chest.
      - Lower slowly back to your upper chest.
    cues:
      - A low incline is enough; too high turns it into a shoulder press.
      - Keep your shoulder blades pulled back.
    common_mistake: Setting the bench so steep that your shoulders do the work.

  - slug: machine-chest-press
    name: Machine chest press
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Adjust the seat so the handles are level with the middle of your chest.
      - Sit with your back against the pad and grip the handles.
      - Push the handles forward until your arms are almost straight.
      - Bring them back slowly.
    cues:
      - Keep your shoulder blades back against the pad.
      - Don't lock your elbows at the front.
    common_mistake: Seat set too high or low, so the handles line up with your neck or stomach.
    harder: barbell-bench-press

  - slug: barbell-bench-press
    name: Barbell bench press
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_mid, delt_front, triceps_lateral]
    equipment: [gym]
    also_needs: Barbell, bench
    difficulty: 4
    effectiveness: 5
    steps:
      - Set the safety bars just below chest height, or ask someone to spot you.
      - Lie on the bench with your eyes under the bar and your feet flat on the floor.
      - Grip the bar a little wider than your shoulders and lift it off the rack.
      - Lower the bar slowly to the middle of your chest.
      - Press it back up until your arms are straight.
    cues:
      - Pull your shoulder blades together and keep them pressed into the bench.
      - Keep your wrists straight, stacked over your elbows.
    common_mistake: Bouncing the bar off your chest to get it moving.
    harder: incline-bench-press

  - slug: incline-bench-press
    name: Incline bench press
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [shoulders, triceps]
    targets: [chest_upper, delt_front, triceps_lateral]
    equipment: [gym]
    also_needs: Barbell, incline bench
    difficulty: 4
    effectiveness: 5
    steps:
      - Lie on an incline bench with your eyes under the bar and set the safety bars.
      - Grip the bar a little wider than your shoulders and lift it off.
      - Lower it slowly to your upper chest.
      - Press it back up until your arms are straight.
    cues:
      - Keep your shoulder blades pulled back.
      - Feet flat on the floor.
    common_mistake: Bouncing the bar off your chest.

  - slug: chest-dip
    name: Chest dip
    category: push
    movement_slot: horizontal_push
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [triceps, shoulders]
    targets: [chest_lower, triceps_lateral]
    equipment: [gym]
    also_needs: Dip bars
    difficulty: 4
    effectiveness: 5
    not_suitable_for: [shoulders]
    steps:
      - Hold the dip bars with your arms straight.
      - Lean your body forward a little.
      - Bend your elbows to lower your body.
      - Push back up until your arms are straight.
    cues:
      - The forward lean moves the work to your chest.
      - Control the way down.
    common_mistake: Going so deep that your shoulders hurt.

  # --- Vertical push -----------------------------------------------------------------

  - slug: pike-push-up
    name: Pike push-up
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps]
    targets: [delt_front, delt_side, triceps_lateral]
    difficulty: 3
    effectiveness: 3
    not_suitable_for: [shoulders]
    steps:
      - Start in a push-up position, then walk your feet in and lift your hips high, like an upside-down V.
      - Place your hands a little wider than your shoulders.
      - Bend your elbows and lower the top of your head towards the floor between your hands.
      - Push back up to the upside-down V.
    cues:
      - Keep your hips high the whole time.
      - Your head goes slightly in front of your hands, making a triangle.
    common_mistake: Letting your hips drop so it turns into a normal push-up.
    harder: feet-elevated-pike-push-up

  - slug: feet-elevated-pike-push-up
    name: Feet-elevated pike push-up
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps]
    targets: [delt_front, delt_side, triceps_lateral]
    also_needs: Chair
    difficulty: 4
    effectiveness: 4
    not_suitable_for: [shoulders]
    steps:
      - Put your feet on a chair and walk your hands back until your hips are high above your shoulders.
      - Place your hands a little wider than your shoulders.
      - Lower the top of your head towards the floor between your hands.
      - Push back up.
    cues:
      - Hips stay high, stacked over your shoulders.
      - Move slowly and with control.
    common_mistake: Feet on a chair that can slide away. Use a stable one.
    harder: wall-handstand-push-up

  - slug: wall-handstand-push-up
    name: Wall handstand push-up
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps]
    targets: [delt_front, delt_side, triceps_lateral]
    also_needs: Wall
    difficulty: 5
    effectiveness: 4
    not_suitable_for: [shoulders]
    steps:
      - Kick up into a handstand with your heels resting against a wall.
      - Place your hands a little wider than your shoulders.
      - Lower the top of your head slowly towards a soft mat on the floor.
      - Push back up until your arms are straight.
    cues:
      - Practise holding a wall handstand first.
      - Use a folded towel or mat under your head.
    common_mistake: Dropping fast and hitting your head on the floor.

  - slug: band-overhead-press
    name: Band overhead press
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps]
    targets: [delt_front, delt_side, triceps_lateral]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand on the middle of the band and hold the ends at your shoulders.
      - Press your hands straight up until your arms are straight.
      - Lower them slowly back to your shoulders.
    cues:
      - Squeeze your stomach and bottom so your back doesn't arch.
      - Hands finish above your head, not in front of it.
    common_mistake: Leaning back to push the band up.

  - slug: seated-dumbbell-shoulder-press
    name: Seated dumbbell shoulder press
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps]
    targets: [delt_front, delt_side, triceps_lateral]
    equipment: [dumbbells]
    also_needs: Chair or bench
    difficulty: 2
    effectiveness: 5
    steps:
      - Sit on a chair or bench with your back against the backrest and feet flat.
      - Hold the dumbbells at shoulder height, palms facing forward.
      - Press them straight up until your arms are almost straight above your head.
      - Lower them slowly back to shoulder height.
    cues:
      - Keep your back against the backrest; don't lean back.
      - Squeeze your stomach so your lower back doesn't arch.
    common_mistake: Arching your lower back to push a heavier weight.
    harder: standing-dumbbell-press

  - slug: standing-dumbbell-press
    name: Standing dumbbell press
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps, core]
    targets: [delt_front, delt_side, triceps_lateral]
    equipment: [dumbbells]
    difficulty: 3
    effectiveness: 5
    not_suitable_for: [back]
    steps:
      - Stand with your feet hip-width apart, holding the dumbbells at shoulder height.
      - Squeeze your stomach and bottom.
      - Press the dumbbells straight up until your arms are straight.
      - Lower them slowly back to your shoulders.
    cues:
      - Ribs down; don't lean back.
      - Push your head slightly forward once the dumbbells pass it.
    common_mistake: Arching your lower back to push heavier.
    harder: arnold-press

  - slug: arnold-press
    name: Arnold press
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps]
    targets: [delt_front, delt_side, triceps_lateral]
    equipment: [dumbbells]
    difficulty: 3
    effectiveness: 4
    steps:
      - Sit or stand holding the dumbbells in front of your shoulders, palms facing you.
      - As you press up, turn your palms to face forward.
      - Finish with your arms straight above your head.
      - Reverse the turn as you lower back to the start.
    cues:
      - Use lighter weights than your normal press.
      - Make the turn smooth, not jerky.
    common_mistake: Rushing the turn and losing control at the top.

  - slug: machine-shoulder-press
    name: Machine shoulder press
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps]
    targets: [delt_front, delt_side, triceps_lateral]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Adjust the seat so the handles are at shoulder height.
      - Sit with your back against the pad and grip the handles.
      - Press up until your arms are almost straight.
      - Lower slowly back to shoulder height.
    cues:
      - Keep your back against the pad.
      - Don't lock your elbows at the top.
    common_mistake: Arching your back off the pad.
    harder: barbell-overhead-press

  - slug: barbell-overhead-press
    name: Barbell overhead press
    category: push
    movement_slot: vertical_push
    exercise_type: compound
    primary_muscle: shoulders
    secondary_muscles: [triceps, core]
    targets: [delt_front, delt_side, triceps_lateral]
    equipment: [gym]
    also_needs: Barbell
    difficulty: 4
    effectiveness: 5
    not_suitable_for: [back]
    steps:
      - Take the bar from a rack at shoulder height, hands just outside your shoulders.
      - Stand with your feet hip-width apart and squeeze your stomach and bottom.
      - Press the bar straight up, moving your head back slightly to let it pass.
      - Finish with the bar above your head, then lower it slowly to your shoulders.
    cues:
      - Keep your ribs down and your body in a straight line.
      - The bar moves in a straight line up and down.
    common_mistake: Leaning back into a standing bench press.

  # --- Chest fly ---------------------------------------------------------------------

  - slug: wide-push-up
    name: Wide push-up
    category: push
    movement_slot: chest_fly
    exercise_type: compound
    primary_muscle: chest
    secondary_muscles: [shoulders]
    targets: [chest_mid, delt_front]
    difficulty: 3
    effectiveness: 3
    steps:
      - Start in a push-up position with your hands much wider than your shoulders.
      - Lower your chest towards the floor.
      - Push back up.
    cues:
      - Feel the stretch across your chest at the bottom.
      - Keep your body in a straight line.
    common_mistake: Hands so wide that your shoulders feel pinched.

  - slug: band-chest-fly
    name: Band chest fly
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    targets: [chest_mid]
    equipment: [resistance_bands]
    also_needs: Anchor
    difficulty: 2
    effectiveness: 3
    steps:
      - Tie the band behind you at chest height and hold one end in each hand, arms open wide.
      - Keep a slight bend in your elbows.
      - Bring your hands together in front of your chest in a hugging motion.
      - Open your arms back out slowly.
    cues:
      - The elbow bend stays the same the whole time.
      - Squeeze your chest when your hands meet.
    common_mistake: Bending your elbows more and turning it into a press.

  - slug: dumbbell-fly
    name: Dumbbell fly
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    targets: [chest_mid]
    equipment: [dumbbells]
    also_needs: Floor or bench
    difficulty: 3
    effectiveness: 4
    not_suitable_for: [shoulders]
    steps:
      - Lie on a bench or the floor with a dumbbell in each hand above your chest, palms facing each other.
      - Keep a slight bend in your elbows.
      - Open your arms out to the sides until you feel a stretch in your chest.
      - Bring the dumbbells back together above your chest.
    cues:
      - Use light dumbbells; the stretch does the work.
      - Imagine hugging a big tree.
    common_mistake: Going too heavy and lowering too far, which strains the shoulders.

  - slug: pec-deck
    name: Pec deck
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    targets: [chest_mid]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Adjust the seat so the handles are at chest height.
      - Sit with your back against the pad and hold the handles with your arms open.
      - Bring the handles together in front of your chest.
      - Open your arms back out slowly.
    cues:
      - Keep a slight bend in your elbows.
      - Squeeze your chest at the front.
    common_mistake: Letting the weights pull your arms too far back.

  - slug: cable-fly
    name: Cable fly
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    targets: [chest_mid]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 5
    steps:
      - Set both pulleys at shoulder height and hold one handle in each hand.
      - Step forward into a split stance with your arms open wide.
      - Bring your hands together in front of your chest in a hugging motion.
      - Open your arms back out slowly.
    cues:
      - Keep a slight bend in your elbows.
      - Lean forward a little from the hips.
    common_mistake: Bending the elbows more and pressing instead of hugging.

  - slug: low-to-high-band-fly
    name: Low-to-high band fly
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    secondary_muscles: [shoulders]
    targets: [chest_upper]
    equipment: [resistance_bands]
    also_needs: Low anchor
    difficulty: 2
    effectiveness: 3
    steps:
      - Tie the band low behind you and hold one end in each hand, arms down by your sides.
      - Keep a slight bend in your elbows.
      - Sweep your hands up and together to chin height.
      - Lower them slowly back down.
    cues:
      - Squeeze your upper chest at the top.
      - The elbow bend stays the same.
    common_mistake: Shrugging your shoulders as your hands rise.

  - slug: incline-dumbbell-fly
    name: Incline dumbbell fly
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    secondary_muscles: [shoulders]
    targets: [chest_upper]
    equipment: [dumbbells, gym]
    also_needs: Incline bench
    difficulty: 3
    effectiveness: 4
    not_suitable_for: [shoulders]
    steps:
      - Lie on an incline bench with a dumbbell in each hand above your chest, palms facing each other.
      - Keep a slight bend in your elbows.
      - Open your arms out to the sides until you feel a stretch in your upper chest.
      - Bring the dumbbells back together above your chest.
    cues:
      - Use light dumbbells.
      - Imagine hugging a big tree.
    common_mistake: Lowering too far and straining the shoulders.

  - slug: low-to-high-cable-fly
    name: Low-to-high cable fly
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    secondary_muscles: [shoulders]
    targets: [chest_upper]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 4
    steps:
      - Set both pulleys at the bottom and hold one handle in each hand.
      - Step forward with your arms down by your sides.
      - Sweep your hands up and together to chin height.
      - Lower them slowly back down.
    cues:
      - Keep a slight bend in your elbows.
      - Squeeze your upper chest at the top.
    common_mistake: Bending the elbows more and curling the handles up.

  - slug: high-to-low-cable-fly
    name: High-to-low cable fly
    category: push
    movement_slot: chest_fly
    exercise_type: isolation
    primary_muscle: chest
    targets: [chest_lower]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 4
    steps:
      - Set both pulleys at the top and hold one handle in each hand.
      - Step forward with your arms open and high.
      - Sweep your hands down and together in front of your hips.
      - Let them go back up slowly.
    cues:
      - Keep a slight bend in your elbows.
      - Squeeze your lower chest where your hands meet.
    common_mistake: Hunching your shoulders forward at the bottom.

  # --- Lateral raise -----------------------------------------------------------------

  - slug: water-bottle-lateral-raise
    name: Water-bottle lateral raise
    category: push
    movement_slot: lateral_raise
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_side]
    also_needs: Bottles or bag
    home_only: true
    difficulty: 1
    effectiveness: 2
    steps:
      - Hold a full water bottle or a loaded bag in each hand by your sides.
      - Lift your arms out to the sides until they are level with your shoulders.
      - Lower them slowly back down.
    cues:
      - Lead with your elbows, not your hands.
      - Do lots of reps; the weight is light.
    common_mistake: Shrugging your shoulders up towards your ears.

  - slug: band-lateral-raise
    name: Band lateral raise
    category: push
    movement_slot: lateral_raise
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_side]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand on the middle of the band and hold one end in each hand by your sides.
      - Lift your arms out to the sides until they are level with your shoulders.
      - Lower them slowly back down.
    cues:
      - Keep a slight bend in your elbows.
      - Stop at shoulder height.
    common_mistake: Swinging your body to get the band up.

  - slug: dumbbell-lateral-raise
    name: Dumbbell lateral raise
    category: push
    movement_slot: lateral_raise
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_side]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 5
    steps:
      - Stand holding a light dumbbell in each hand by your sides.
      - Lift your arms out to the sides until they are level with your shoulders.
      - Lower them slowly back down.
    cues:
      - Lead with your elbows and keep a slight bend in them.
      - Go light and strict; this muscle is small.
    common_mistake: Swinging the dumbbells up with your whole body.

  - slug: cable-lateral-raise
    name: Cable lateral raise
    category: push
    movement_slot: lateral_raise
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_side]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 5
    steps:
      - Set the pulley low and stand side-on to it, holding the handle in the far hand.
      - Lift your arm out to the side until it is level with your shoulder.
      - Lower it slowly back down.
      - Finish all reps, then switch sides.
    cues:
      - Lead with your elbow.
      - Hold the machine with your free hand to stay still.
    common_mistake: Leaning away from the machine to cheat the weight up.

  - slug: machine-lateral-raise
    name: Machine lateral raise
    category: push
    movement_slot: lateral_raise
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_side]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Sit in the machine with the pads against the outside of your arms.
      - Lift your arms out to the sides until they are level with your shoulders.
      - Lower them slowly back down.
    cues:
      - Keep your shoulders down, away from your ears.
      - Pause at the top.
    common_mistake: Shrugging to lift the pads.

  # --- Triceps -----------------------------------------------------------------------

  - slug: bench-dip
    name: Bench dip
    category: push
    movement_slot: triceps
    exercise_type: compound
    primary_muscle: triceps
    secondary_muscles: [chest, shoulders]
    targets: [triceps_long, triceps_lateral, triceps_medial]
    also_needs: Chair
    difficulty: 2
    effectiveness: 3
    not_suitable_for: [shoulders]
    steps:
      - Sit on the edge of a sturdy chair and put your hands next to your hips.
      - Slide your bottom off the chair with your knees bent and feet flat.
      - Bend your elbows to lower your body a little.
      - Push back up until your arms are straight.
    cues:
      - Keep your back close to the chair.
      - Only go a short way down.
    common_mistake: Going too deep, which strains the front of the shoulders.

  - slug: bodyweight-triceps-extension
    name: Bodyweight triceps extension
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    secondary_muscles: [core]
    targets: [triceps_long, triceps_lateral]
    also_needs: Table
    home_only: true
    difficulty: 3
    effectiveness: 4
    steps:
      - Put your hands on the edge of a sturdy table, shoulder-width apart, and walk your feet back.
      - Keep your body straight and bend only your elbows to lower your forehead towards your hands.
      - Straighten your arms to push back up.
    cues:
      - Elbows point down, not out.
      - Walk your feet back to make it harder.
    common_mistake: Bending at the shoulders so it turns into a push-up.

  - slug: band-pushdown
    name: Band pushdown
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_lateral, triceps_medial]
    equipment: [resistance_bands]
    also_needs: High anchor
    difficulty: 1
    effectiveness: 3
    steps:
      - Anchor the band over the top of a door and hold one end in each hand.
      - Tuck your elbows against your sides with your hands at chest height.
      - Push down until your arms are straight.
      - Let your hands come back up slowly.
    cues:
      - Only your forearms move.
      - Squeeze at the bottom.
    common_mistake: Letting your elbows drift forward.

  - slug: band-overhead-extension
    name: Band overhead extension
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_long]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand on one end of the band and hold the other end behind your head with both hands.
      - Point your elbows up towards the ceiling.
      - Straighten your arms above your head.
      - Lower your hands slowly back behind your head.
    cues:
      - Keep your elbows close to your head.
      - Feel the stretch at the bottom.
    common_mistake: Letting your elbows flare wide.

  - slug: overhead-dumbbell-extension
    name: Overhead dumbbell extension
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_long]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 4
    steps:
      - Sit or stand holding one dumbbell with both hands above your head.
      - Bend your elbows to lower the dumbbell behind your head.
      - Straighten your arms to lift it back up.
    cues:
      - Keep your elbows pointing up and close to your head.
      - Go slowly; feel the stretch at the bottom.
    common_mistake: Arching your lower back as the dumbbell goes up.

  - slug: dumbbell-kickback
    name: Dumbbell kickback
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_lateral, triceps_long]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 3
    steps:
      - Lean forward with one hand on a chair and hold a dumbbell in the other.
      - Lift your elbow so your upper arm is level with your body.
      - Straighten your arm behind you.
      - Bend it back slowly.
    cues:
      - Your upper arm stays still.
      - Squeeze at the top.
    common_mistake: Swinging the dumbbell instead of straightening the arm.

  - slug: lying-dumbbell-extension
    name: Lying dumbbell extension
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_long, triceps_lateral]
    equipment: [dumbbells]
    also_needs: Floor or bench
    difficulty: 3
    effectiveness: 4
    steps:
      - Lie on a bench or the floor with a dumbbell in each hand, arms straight above your chest.
      - Bend your elbows to lower the dumbbells beside your head.
      - Straighten your arms to lift them back up.
    cues:
      - Elbows stay pointing at the ceiling.
      - Move slowly near your head.
    common_mistake: Letting your elbows drift out wide.

  - slug: cable-triceps-pushdown
    name: Cable triceps pushdown
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_lateral, triceps_medial]
    equipment: [gym]
    also_needs: Cable
    difficulty: 1
    effectiveness: 5
    steps:
      - Attach a straight bar or rope to the high cable and stand facing it.
      - Hold it with your elbows bent and tucked against your sides.
      - Push down until your arms are straight.
      - Slowly let your hands come back up to chest height, keeping your elbows still.
    cues:
      - Only your forearms move; your elbows stay glued to your sides.
      - Stand tall with a slight lean forward.
    common_mistake: Letting your elbows drift forward and pushing with your shoulders.

  - slug: rope-overhead-extension
    name: Rope overhead extension
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_long]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 5
    steps:
      - Attach a rope to the low cable and hold it behind your head, facing away from the machine.
      - Step forward into a split stance and lean forward a little.
      - Straighten your arms forward and up.
      - Let the rope come back slowly behind your head.
    cues:
      - Elbows stay pointing forward.
      - Feel the stretch behind your head.
    common_mistake: Moving your elbows and turning it into a pull.

  - slug: parallel-bar-dip
    name: Parallel-bar dip
    category: push
    movement_slot: triceps
    exercise_type: compound
    primary_muscle: triceps
    secondary_muscles: [chest, shoulders]
    targets: [triceps_long, triceps_lateral, triceps_medial, chest_lower]
    equipment: [gym]
    also_needs: Dip bars
    difficulty: 4
    effectiveness: 5
    not_suitable_for: [shoulders]
    steps:
      - Hold the dip bars and jump or step up until your arms are straight.
      - Bend your elbows to lower your body until your upper arms are about level with the floor.
      - Push back up until your arms are straight.
    cues:
      - Stay upright for more triceps work.
      - Only go as low as your shoulders feel fine.
    common_mistake: Dropping too low and straining the front of the shoulders.

  - slug: close-grip-bench-press
    name: Close-grip bench press
    category: push
    movement_slot: triceps
    exercise_type: compound
    primary_muscle: triceps
    secondary_muscles: [chest, shoulders]
    targets: [triceps_long, triceps_lateral, triceps_medial]
    equipment: [gym]
    also_needs: Barbell, bench
    difficulty: 4
    effectiveness: 5
    steps:
      - Lie on a flat bench with the safety bars set and grip the bar shoulder-width apart.
      - Lift the bar off and hold it above your chest.
      - Lower it slowly to your lower chest, elbows close to your body.
      - Press it back up.
    cues:
      - Shoulder-width grip; narrower hurts the wrists.
      - Elbows stay tucked in.
    common_mistake: Gripping so narrow that your wrists bend.

  - slug: skull-crusher
    name: Skull crusher
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_long, triceps_lateral]
    equipment: [gym]
    also_needs: EZ bar, bench
    difficulty: 3
    effectiveness: 5
    steps:
      - Lie on a bench holding an EZ bar above your chest with straight arms.
      - Bend your elbows to lower the bar towards your forehead or just behind your head.
      - Straighten your arms to lift it back up.
    cues:
      - Upper arms stay still.
      - Lower the bar slightly behind your head for more stretch.
    common_mistake: Letting your elbows flare out.

  - slug: reverse-grip-cable-pushdown
    name: Reverse-grip cable pushdown
    category: push
    movement_slot: triceps
    exercise_type: isolation
    primary_muscle: triceps
    targets: [triceps_medial]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 3
    steps:
      - Hold a straight bar on the high cable with your palms facing up.
      - Tuck your elbows against your sides.
      - Push down until your arms are straight.
      - Let the bar come back up slowly.
    cues:
      - Use a lighter weight than a normal pushdown.
      - Only your forearms move.
    common_mistake: Bending your wrists back under the weight.

  # --- Front raise -------------------------------------------------------------------

  - slug: band-front-raise
    name: Band front raise
    category: push
    movement_slot: front_raise
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_front]
    equipment: [resistance_bands]
    difficulty: 1
    effectiveness: 2
    steps:
      - Stand on the band and hold one end in each hand in front of your thighs.
      - Lift your straight arms forward to shoulder height.
      - Lower them slowly back down.
    cues:
      - Keep a slight bend in your elbows.
      - Stop at shoulder height.
    common_mistake: Leaning back to lift the band.

  - slug: dumbbell-front-raise
    name: Dumbbell front raise
    category: push
    movement_slot: front_raise
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_front]
    equipment: [dumbbells]
    difficulty: 1
    effectiveness: 3
    steps:
      - Stand holding a light dumbbell in each hand in front of your thighs.
      - Lift your arms forward to shoulder height.
      - Lower them slowly back down.
    cues:
      - Keep your body still.
      - Stop at shoulder height.
    common_mistake: Swinging the dumbbells up with your hips.

  # ===================================================================================
  # PULL
  # ===================================================================================

  # --- Horizontal pull ---------------------------------------------------------------

  - slug: loaded-backpack-row
    name: Loaded backpack row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    also_needs: Backpack with books
    home_only: true
    difficulty: 1
    effectiveness: 3
    steps:
      - Fill a backpack with books and hold it by the top handle in one hand.
      - Put your other hand and knee on a chair or bed and keep your back flat.
      - Pull the bag up towards your hip, leading with your elbow.
      - Lower it slowly until your arm is straight.
    cues:
      - Squeeze your shoulder blade back at the top.
      - Keep your back flat and still.
    common_mistake: Twisting your body to swing the bag up.
    harder: table-row

  - slug: table-row
    name: Table row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    also_needs: Sturdy table
    home_only: true
    difficulty: 3
    effectiveness: 4
    steps:
      - Lie on your back under a sturdy table and grip its edge with both hands, shoulder-width apart.
      - Bend your knees with your feet flat, or keep your legs straight to make it harder.
      - Pull your chest up towards the table edge.
      - Lower yourself slowly until your arms are straight.
    cues:
      - Check the table is solid and won't tip before every set.
      - Keep your body straight from knees to head.
    common_mistake: Using a light or wobbly table that can tip over onto you.
    harder: feet-elevated-table-row

  - slug: feet-elevated-table-row
    name: Feet-elevated table row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    also_needs: Sturdy table, chair
    home_only: true
    difficulty: 4
    effectiveness: 4
    steps:
      - Lie under a sturdy table with your heels resting on a chair.
      - Grip the table edge with both hands, shoulder-width apart.
      - Pull your chest up towards the edge, keeping your body straight.
      - Lower yourself slowly until your arms are straight.
    cues:
      - Check the table and chair are both stable first.
      - Squeeze your shoulder blades together at the top.
    common_mistake: Letting your hips sag so only your arms move.

  - slug: seated-band-row
    name: Seated band row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [resistance_bands]
    difficulty: 1
    effectiveness: 3
    steps:
      - Sit on the floor with your legs straight and loop the band around your feet.
      - Hold one end in each hand and sit tall.
      - Pull your hands towards your stomach, elbows close to your body.
      - Let your arms straighten slowly.
    cues:
      - Squeeze your shoulder blades together at the end.
      - Stay sitting tall; don't lean back.
    common_mistake: Leaning backwards to pull instead of using your back.

  - slug: bent-over-band-row
    name: Bent-over band row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    not_suitable_for: [back]
    steps:
      - Stand on the middle of the band with your feet hip-width apart.
      - Push your hips back and lean forward with a flat back, holding the band ends.
      - Pull your hands up towards your stomach.
      - Lower them slowly.
    cues:
      - Keep your back flat the whole time.
      - Elbows go back, close to your body.
    common_mistake: Standing up as you pull.

  - slug: one-arm-dumbbell-row
    name: One-arm dumbbell row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [dumbbells]
    also_needs: Chair or bench
    difficulty: 2
    effectiveness: 5
    steps:
      - Put one hand and the same knee on a bench or chair, holding a dumbbell in the other hand.
      - Keep your back flat like a table.
      - Pull the dumbbell up towards your hip, leading with your elbow.
      - Lower it slowly until your arm is straight.
    cues:
      - Think of pulling your elbow to your back pocket.
      - Keep your shoulders level.
    common_mistake: Twisting your body open to lift a heavier dumbbell.
    harder: bent-over-dumbbell-row

  - slug: bent-over-dumbbell-row
    name: Bent-over dumbbell row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [dumbbells]
    difficulty: 3
    effectiveness: 4
    not_suitable_for: [back]
    steps:
      - Hold a dumbbell in each hand and push your hips back, leaning forward with a flat back.
      - Let the dumbbells hang below your shoulders.
      - Pull both dumbbells up towards your stomach.
      - Lower them slowly.
    cues:
      - Keep your back flat and your neck in line.
      - Squeeze your shoulder blades together at the top.
    common_mistake: Rounding your back as you get tired.

  - slug: chest-supported-dumbbell-row
    name: Chest-supported dumbbell row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [dumbbells, gym]
    also_needs: Incline bench
    difficulty: 2
    effectiveness: 5
    steps:
      - Set a bench to an incline and lie face down on it with a dumbbell in each hand.
      - Let your arms hang straight down.
      - Pull the dumbbells up towards your ribs.
      - Lower them slowly.
    cues:
      - Keep your chest on the bench the whole time.
      - Squeeze your shoulder blades together at the top.
    common_mistake: Lifting your chest off the bench to heave the weight.

  - slug: machine-row
    name: Machine row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Adjust the seat so the handles are at chest height and put your chest on the pad.
      - Grip the handles with straight arms.
      - Pull the handles back towards your body.
      - Let them go forward slowly.
    cues:
      - Keep your chest on the pad.
      - Squeeze your shoulder blades together at the back.
    common_mistake: Jerking the handles with your whole body.

  - slug: seated-cable-row
    name: Seated cable row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 5
    steps:
      - Sit at the cable row with your feet on the plate and knees slightly bent.
      - Grip the handle and sit tall with straight arms.
      - Pull the handle to your stomach, keeping your elbows close.
      - Let your arms go forward slowly.
    cues:
      - Chest up, shoulders down.
      - Your body stays still; your arms and back move.
    common_mistake: Rocking backwards and forwards to move the weight.

  - slug: inverted-row
    name: Inverted row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, core, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [gym]
    also_needs: Low bar or Smith machine
    difficulty: 3
    effectiveness: 4
    steps:
      - Set a bar at about hip height and lie under it.
      - Grip the bar a little wider than your shoulders with your body straight and heels on the floor.
      - Pull your chest up to the bar.
      - Lower yourself slowly until your arms are straight.
    cues:
      - Keep your body straight from heels to head.
      - Bend your knees to make it easier.
    common_mistake: Letting your hips sag towards the floor.

  - slug: barbell-row
    name: Barbell row
    category: pull
    movement_slot: horizontal_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, shoulders]
    targets: [mid_back, lats, delt_rear]
    equipment: [gym]
    also_needs: Barbell
    difficulty: 4
    effectiveness: 5
    not_suitable_for: [back]
    steps:
      - Hold the bar with your hands a little wider than your shoulders.
      - Push your hips back and lean forward with a flat back until your chest is almost level with the floor.
      - Pull the bar to your lower chest.
      - Lower it slowly until your arms are straight.
    cues:
      - Keep your back flat and still.
      - Brace your stomach before each rep.
    common_mistake: Standing up more with each rep to swing the bar.

  # --- Vertical pull -----------------------------------------------------------------

  - slug: dead-hang
    name: Dead hang
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [forearms]
    targets: [forearm_flexors, lats]
    equipment: [pull_up_bar]
    difficulty: 1
    effectiveness: 2
    is_timed: true
    steps:
      - Grip the pull-up bar with your hands shoulder-width apart.
      - Lift your feet and hang with straight arms.
      - Hold for the set time, then step down.
    cues:
      - Breathe normally.
      - Use a chair to get up and down safely.
    common_mistake: Dropping off the bar suddenly instead of stepping down.
    harder: scapular-pull

  - slug: scapular-pull
    name: Scapular pull
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [forearms, traps]
    targets: [lower_traps, lats]
    equipment: [pull_up_bar]
    difficulty: 2
    effectiveness: 2
    steps:
      - Hang from the pull-up bar with straight arms.
      - Without bending your elbows, pull your shoulders down away from your ears so your body rises a little.
      - Relax back to a full hang.
    cues:
      - Your arms stay straight the whole time.
      - It's a small movement.
    common_mistake: Bending your elbows and turning it into a tiny pull-up.
    harder: negative-pull-up

  - slug: negative-pull-up
    name: Negative pull-up
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, traps]
    targets: [lats, lower_traps]
    equipment: [pull_up_bar]
    also_needs: Chair to step up
    difficulty: 3
    effectiveness: 4
    steps:
      - Stand on a chair and grip the bar with your chin above it.
      - Step off the chair and hold yourself at the top.
      - Lower yourself as slowly as you can, taking 3 to 5 seconds, until your arms are straight.
      - Step back onto the chair and repeat.
    cues:
      - Fight the way down the whole time.
      - Keep your chest up.
    common_mistake: Dropping down fast, which builds very little.
    harder: band-assisted-pull-up

  - slug: band-assisted-pull-up
    name: Band-assisted pull-up
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, traps]
    targets: [lats, lower_traps]
    equipment: [pull_up_bar, resistance_bands]
    also_needs: Loop band
    difficulty: 3
    effectiveness: 4
    steps:
      - Loop a band over the bar and put one knee or foot in the bottom of the loop.
      - Grip the bar a little wider than your shoulders.
      - Pull yourself up until your chin is over the bar.
      - Lower yourself slowly until your arms are straight.
    cues:
      - Use a thinner band as you get stronger.
      - Lower slowly; don't let the band bounce you.
    common_mistake: Letting the band fling you up and down.
    harder: chin-up

  - slug: chin-up
    name: Chin-up
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps]
    targets: [lats, biceps_long, biceps_short]
    equipment: [pull_up_bar]
    difficulty: 4
    effectiveness: 5
    steps:
      - Grip the bar with your palms facing you, shoulder-width apart.
      - Hang with straight arms.
      - Pull yourself up until your chin is over the bar.
      - Lower yourself slowly until your arms are straight.
    cues:
      - Pull your elbows down towards your ribs.
      - No swinging or kicking.
    common_mistake: Only going halfway down between reps.
    harder: pull-up

  - slug: pull-up
    name: Pull-up
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, traps]
    targets: [lats, lower_traps]
    equipment: [pull_up_bar]
    difficulty: 4
    effectiveness: 5
    steps:
      - Grip the bar with your palms facing away, a little wider than your shoulders.
