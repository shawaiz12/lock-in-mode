    category: pull
    movement_slot: forearms
    exercise_type: isolation
    primary_muscle: forearms
    secondary_muscles: [biceps]
    targets: [brachioradialis, forearm_extensors]
    also_needs: Backpack with books
    home_only: true
    difficulty: 1
    effectiveness: 2
    steps:
      - Hold a lightly loaded backpack by its top handle with both hands, palms facing down.
      - Let it hang in front of your thighs with your arms straight.
      - Curl it up towards your chest, keeping your palms down and wrists straight.
      - Lower it slowly.
    cues:
      - Use fewer books than for a normal curl.
      - Keep your wrists straight, not bent back.
    common_mistake: Letting your wrists bend back under the weight.

  - slug: reverse-curl
    name: Reverse curl
    category: pull
    movement_slot: forearms
    exercise_type: isolation
    primary_muscle: forearms
    secondary_muscles: [biceps]
    targets: [brachioradialis, forearm_extensors]
    equipment: [dumbbells]
    difficulty: 1
    effectiveness: 3
    steps:
      - Stand holding a light dumbbell in each hand with your palms facing down.
      - Curl the dumbbells up towards your shoulders, keeping your palms down.
      - Lower them slowly.
    cues:
      - Keep your wrists straight.
      - Use lighter weights than a normal curl.
    common_mistake: Bending your wrists as you lift.

  - slug: dumbbell-wrist-curl
    name: Dumbbell wrist curl
    category: pull
    movement_slot: forearms
    exercise_type: isolation
    primary_muscle: forearms
    targets: [forearm_flexors]
    equipment: [dumbbells]
    also_needs: Chair
    difficulty: 1
    effectiveness: 3
    steps:
      - Sit on a chair and rest your forearm on your thigh, palm up, with your wrist just past your knee.
      - Hold a light dumbbell and let your wrist bend down.
      - Curl your wrist up as far as you can.
      - Lower it slowly.
    cues:
      - Only your wrist moves.
      - Use a light weight and many reps.
    common_mistake: Lifting your forearm off your thigh.

  - slug: dumbbell-reverse-wrist-curl
    name: Dumbbell reverse wrist curl
    category: pull
    movement_slot: forearms
    exercise_type: isolation
    primary_muscle: forearms
    targets: [forearm_extensors]
    equipment: [dumbbells]
    also_needs: Chair
    difficulty: 1
    effectiveness: 3
    steps:
      - Sit on a chair and rest your forearm on your thigh, palm down, with your wrist just past your knee.
      - Hold a very light dumbbell and let your wrist bend down.
      - Lift the back of your hand up as far as you can.
      - Lower it slowly.
    cues:
      - Only your wrist moves.
      - Use a very light weight.
    common_mistake: Using a weight so heavy that your forearm lifts.

  - slug: towel-hang
    name: Towel hang
    category: pull
    movement_slot: forearms
    exercise_type: isolation
    primary_muscle: forearms
    secondary_muscles: [back]
    targets: [forearm_flexors]
    equipment: [pull_up_bar]
    also_needs: Towel
    difficulty: 3
    effectiveness: 4
    is_timed: true
    steps:
      - Loop one or two towels over the pull-up bar.
      - Grip the towels tightly and lift your feet off the floor.
      - Hang for the set time, then step down.
    cues:
      - Use a chair to get up and down.
      - Squeeze the towels as hard as you can.
    common_mistake: Using thin towels that slip.

  # --- Traps -------------------------------------------------------------------------

  - slug: backpack-shrug
    name: Backpack shrug
    category: pull
    movement_slot: traps
    exercise_type: isolation
    primary_muscle: traps
    targets: [upper_traps]
    also_needs: Loaded backpack or bags
    home_only: true
    difficulty: 1
    effectiveness: 2
    steps:
      - Hold a loaded backpack or a heavy bag in each hand by your sides.
      - Lift your shoulders straight up towards your ears.
      - Pause, then lower them slowly.
    cues:
      - Straight up and down; no rolling.
      - Keep your arms straight.
    common_mistake: Rolling your shoulders in circles.

  - slug: band-shrug
    name: Band shrug
    category: pull
    movement_slot: traps
    exercise_type: isolation
    primary_muscle: traps
    targets: [upper_traps]
    equipment: [resistance_bands]
    difficulty: 1
    effectiveness: 3
    steps:
      - Stand on the middle of the band and hold one end in each hand by your sides.
      - Lift your shoulders straight up towards your ears.
      - Pause, then lower them slowly.
    cues:
      - Keep your arms straight.
      - Pause at the top.
    common_mistake: Bending your elbows to pull the band up.

  - slug: dumbbell-shrug
    name: Dumbbell shrug
    category: pull
    movement_slot: traps
    exercise_type: isolation
    primary_muscle: traps
    secondary_muscles: [forearms]
    targets: [upper_traps]
    equipment: [dumbbells]
    difficulty: 1
    effectiveness: 5
    steps:
      - Stand holding a dumbbell in each hand by your sides.
      - Lift your shoulders straight up towards your ears.
      - Pause, then lower them slowly.
    cues:
      - Straight up and down; no rolling.
      - Keep your arms straight.
    common_mistake: Rolling your shoulders in circles.

  - slug: barbell-shrug
    name: Barbell shrug
    category: pull
    movement_slot: traps
    exercise_type: isolation
    primary_muscle: traps
    secondary_muscles: [forearms]
    targets: [upper_traps]
    equipment: [gym]
    also_needs: Barbell
    difficulty: 2
    effectiveness: 5
    steps:
      - Hold a barbell in front of your thighs, hands just outside your legs.
      - Lift your shoulders straight up towards your ears.
      - Pause, then lower them slowly.
    cues:
      - Keep your arms straight.
      - Stand tall.
    common_mistake: Bouncing the bar with your knees.

  - slug: prone-y-raise
    name: Prone Y raise
    category: pull
    movement_slot: traps
    exercise_type: isolation
    primary_muscle: traps
    secondary_muscles: [shoulders]
    targets: [lower_traps]
    difficulty: 1
    effectiveness: 3
    steps:
      - Lie face down with your arms stretched above your head in a Y shape, thumbs pointing up.
      - Lift your arms off the floor by squeezing between your shoulder blades.
      - Hold for a second, then lower them slowly.
    cues:
      - Rest your forehead on a towel.
      - Small lifts are fine.
    common_mistake: Arching your lower back to lift higher.

  # ===================================================================================
  # LEGS
  # ===================================================================================

  # --- Squat -------------------------------------------------------------------------

  - slug: chair-squat
    name: Chair squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    also_needs: Chair
    home_only: true
    difficulty: 1
    effectiveness: 3
    steps:
      - Stand in front of a chair with your feet shoulder-width apart.
      - Push your hips back and bend your knees until you sit lightly on the chair.
      - Lean forward a little and stand back up by pushing through your whole foot.
    cues:
      - Keep your chest up and your knees pointing the same way as your toes.
      - Touch the chair, don't flop onto it.
    common_mistake: Rocking backwards and dropping onto the chair instead of lowering with control.
    harder: bodyweight-squat

  - slug: bodyweight-squat
    name: Bodyweight squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand with your feet shoulder-width apart, toes turned out a little.
      - Push your hips back and bend your knees as if sitting on a low chair.
      - Go down until your thighs are about level with the floor, or as low as feels good.
      - Push through your whole foot to stand back up.
    cues:
      - Keep your heels on the floor the whole time.
      - Knees follow the direction of your toes.
    common_mistake: Letting your knees fall inwards as you stand up.
    harder: tempo-squat

  - slug: tempo-squat
    name: Tempo squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand with your feet shoulder-width apart.
      - Count three seconds slowly as you squat down.
      - Pause for one second at the bottom.
      - Stand back up at normal speed.
    cues:
      - The slow way down is the whole point; don't rush it.
      - Keep your chest up and heels down.
    common_mistake: Counting fast so the lowering takes one second, not three.
    harder: one-and-a-half-squat

  - slug: one-and-a-half-squat
    name: One-and-a-half squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    difficulty: 3
    effectiveness: 3
    steps:
      - Squat all the way down.
      - Come halfway up, then go back down to the bottom again.
      - Stand all the way up. That is one rep.
    cues:
      - Stay low and controlled during the half rep.
      - Keep your heels down and chest up.
    common_mistake: Bouncing at the bottom instead of moving with control.
    harder: pistol-squat-to-chair

  - slug: pistol-squat-to-chair
    name: Pistol squat to chair
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    also_needs: Chair
    difficulty: 4
    effectiveness: 4
    not_suitable_for: [knees]
    steps:
      - Stand in front of a chair on one leg, the other leg held out in front.
      - Push your hips back and lower yourself slowly on one leg until you sit on the chair.
      - Lean forward and stand back up on the same leg.
    cues:
      - Reach your arms forward to help your balance.
      - Lower slowly; don't drop onto the chair.
    common_mistake: Letting the standing knee collapse inwards.
    harder: pistol-squat

  - slug: pistol-squat
    name: Pistol squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    difficulty: 5
    effectiveness: 4
    not_suitable_for: [knees]
    steps:
      - Stand on one leg with the other leg held straight out in front of you.
      - Reach your arms forward and squat down on the standing leg as low as you can control.
      - Push through your whole foot to stand back up.
    cues:
      - Keep your heel down the whole time.
      - Practise holding onto a door frame first if balance is the problem.
    common_mistake: Falling backwards at the bottom because the heel lifts.

  - slug: band-squat
    name: Band squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand on the middle of the band with your feet shoulder-width apart.
      - Hold the ends of the band at your shoulders.
      - Squat down by pushing your hips back and bending your knees.
      - Stand back up against the band.
    cues:
      - Keep your hands at your shoulders the whole time.
      - Stand all the way up; the band is hardest at the top.
    common_mistake: Standing with feet too close together so the band slips off.
    harder: band-front-squat

  - slug: band-front-squat
    name: Band front squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, core]
    targets: [quads_vastus, glute_max]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand on the band with your feet shoulder-width apart.
      - Bring the band up and hold it across the front of your shoulders.
      - Squat down, keeping your elbows high.
      - Stand back up against the band.
    cues:
      - Keep your chest tall so the band doesn't pull you forward.
      - Brace your stomach before each rep.
    common_mistake: Letting the elbows drop so you tip forward.

  - slug: goblet-squat
    name: Goblet squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, core]
    targets: [quads_vastus, glute_max]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 4
    steps:
      - Hold one dumbbell upright against your chest with both hands.
      - Stand with your feet a little wider than your shoulders.
      - Squat down between your legs, keeping the dumbbell against your chest.
      - Push through your whole foot to stand back up.
    cues:
      - Elbows point down and stay inside your knees at the bottom.
      - Keep your chest up so the dumbbell stays close.
    common_mistake: Letting the dumbbell drift away from your chest and rounding your back.
    harder: dumbbell-front-squat

  - slug: dumbbell-front-squat
    name: Dumbbell front squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, core]
    targets: [quads_vastus, glute_max]
    equipment: [dumbbells]
    difficulty: 3
    effectiveness: 4
    steps:
      - Hold a dumbbell in each hand and rest one end of each on the front of your shoulders.
      - Stand with your feet shoulder-width apart.
      - Squat down, keeping your elbows pointing forward.
      - Stand back up by pushing through your whole foot.
    cues:
      - Stay tall through your upper back.
      - Brace your stomach before you go down.
    common_mistake: Letting the dumbbells slide off the shoulders as you get tired.

  - slug: leg-press
    name: Leg press
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Sit in the machine and put your feet flat on the plate, shoulder-width apart.
      - Release the safety handles.
      - Bend your knees and lower the plate slowly towards your chest.
      - Push the plate away until your legs are almost straight.
    cues:
      - Keep your lower back pressed into the seat.
      - Never lock your knees straight at the top.
    common_mistake: Going so deep that your hips lift off the seat.
    harder: barbell-back-squat

  - slug: hack-squat
    name: Hack squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max]
    equipment: [gym]
    also_needs: Machine
    difficulty: 2
    effectiveness: 4
    not_suitable_for: [knees]
    steps:
      - Stand in the machine with your back and shoulders against the pads.
      - Place your feet shoulder-width apart in the middle of the platform.
      - Release the safety handles and squat down slowly.
      - Push back up until your legs are almost straight.
    cues:
      - Keep your back flat against the pad.
      - Knees follow the direction of your toes.
    common_mistake: Rising onto your toes instead of pushing through your whole foot.

  - slug: barbell-back-squat
    name: Barbell back squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, hamstrings, core]
    targets: [quads_vastus, glute_max]
    equipment: [gym]
    also_needs: Barbell, rack
    difficulty: 4
    effectiveness: 5
    not_suitable_for: [knees, back]
    steps:
      - Set the bar in the rack at chest height and the safety bars just below your squat depth.
      - Step under the bar and rest it on your upper back, not your neck.
      - Stand up to lift it off, take two small steps back and set your feet shoulder-width.
      - Squat down by pushing your hips back and bending your knees.
      - Push through your whole foot to stand back up.
    cues:
      - Take a big breath and brace your stomach before each rep.
      - Knees follow your toes; chest stays up.
    common_mistake: Letting your lower back round at the bottom of the squat.
    harder: front-squat

  - slug: front-squat
    name: Front squat
    category: legs
    movement_slot: squat
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, core]
    targets: [quads_vastus, glute_max]
    equipment: [gym]
    also_needs: Barbell, rack
    difficulty: 5
    effectiveness: 5
    not_suitable_for: [knees]
    steps:
      - Set the bar in the rack at chest height and the safety bars just below your squat depth.
      - Rest the bar on the front of your shoulders, elbows pointing forward.
      - Lift it off, step back and set your feet shoulder-width apart.
      - Squat down, keeping your elbows high.
      - Stand back up by pushing through your whole foot.
    cues:
      - Elbows high keeps the bar in place.
      - Stay as upright as you can.
    common_mistake: Elbows dropping so the bar rolls forward.

  # --- Single-leg --------------------------------------------------------------------

  - slug: supported-split-squat
    name: Supported split squat
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    also_needs: Chair or wall
    difficulty: 1
    effectiveness: 3
    steps:
      - Stand next to a wall or chair and hold it with one hand.
      - Take a long step forward so your feet are about a stride apart.
      - Bend both knees and lower your back knee towards the floor.
      - Push through your front foot to come back up.
    cues:
      - Use the support for balance, not to pull yourself up.
      - Most of your weight stays on the front foot.
    common_mistake: Taking too short a step so the front knee shoots far forward.
    harder: split-squat

  - slug: split-squat
    name: Split squat
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    difficulty: 2
    effectiveness: 4
    steps:
      - Take a long step forward so your feet are about a stride apart.
      - Bend both knees and lower your back knee towards the floor.
      - Push through your front foot to come back up.
      - Finish all reps on one side, then switch.
    cues:
      - Keep your body upright.
      - Your feet stay in place the whole time.
    common_mistake: Standing with both feet in one line, like on a tightrope, which ruins your balance.
    harder: reverse-lunge

  - slug: reverse-lunge
    name: Reverse lunge
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, hamstrings]
    targets: [quads_vastus, glute_max, glute_med]
    difficulty: 2
    effectiveness: 4
    steps:
      - Stand tall with your feet together.
      - Take a big step backwards with one foot.
      - Bend both knees and lower your back knee towards the floor.
      - Push through your front foot to step back to the start.
    cues:
      - Most of your weight stays on the front foot.
      - Keep your chest up.
    common_mistake: Pushing off the back foot instead of the front foot.
    harder: walking-lunge

  - slug: walking-lunge
    name: Walking lunge
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, hamstrings]
    targets: [quads_vastus, glute_max, glute_med]
    difficulty: 3
    effectiveness: 4
    not_suitable_for: [knees]
    steps:
      - Stand tall and take a big step forward.
      - Bend both knees and lower your back knee towards the floor.
      - Push through your front foot and bring your back foot forward into the next step.
      - Keep walking forward, switching legs each step.
    cues:
      - Take long steps so your front knee stays over your foot.
      - Keep your chest up.
    common_mistake: Short, quick steps that push your knee far past your toes.
    harder: step-up

  - slug: step-up
    name: Step-up
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    also_needs: Step or stair
    difficulty: 3
    effectiveness: 4
    steps:
      - Stand facing a sturdy step or the bottom stair.
      - Put one whole foot on the step.
      - Push through that foot to stand up on the step.
      - Lower yourself back down slowly with the same leg.
    cues:
      - The leg on the step does the work; don't push off the floor.
      - The higher the step, the harder it gets.
    common_mistake: Dropping down fast instead of lowering with control.
    harder: bulgarian-split-squat

  - slug: bulgarian-split-squat
    name: Bulgarian split squat
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    also_needs: Chair
    difficulty: 4
    effectiveness: 5
    not_suitable_for: [knees]
    steps:
      - Stand about a big step in front of a chair, facing away from it.
      - Put the top of one foot on the chair behind you.
      - Bend your front knee and lower your back knee towards the floor.
      - Push through your front foot to come back up.
    cues:
      - Most of your weight stays on the front leg.
      - Lean your chest forward a little for more glute work.
    common_mistake: Standing too close to the chair so the front knee is cramped.

  - slug: band-split-squat
    name: Band split squat
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    steps:
      - Step one foot onto the middle of the band and hold the ends at your shoulders.
      - Take a long step back with the other foot.
      - Bend both knees and lower your back knee towards the floor.
      - Push through your front foot to come back up.
    cues:
      - Keep the band under the middle of your front foot.
      - Stay upright.
    common_mistake: Letting the band pull your hands forward away from your shoulders.

  - slug: dumbbell-reverse-lunge
    name: Dumbbell reverse lunge
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, hamstrings]
    targets: [quads_vastus, glute_max, glute_med]
    equipment: [dumbbells]
    difficulty: 3
    effectiveness: 4
    steps:
      - Stand tall with a dumbbell in each hand by your sides.
      - Take a big step backwards with one foot.
      - Lower your back knee towards the floor.
      - Push through your front foot to step back to the start.
    cues:
      - Keep the dumbbells hanging straight down.
      - Most of your weight stays on the front foot.
    common_mistake: Leaning far forward so the dumbbells pull you off balance.
    harder: dumbbell-step-up

  - slug: dumbbell-step-up
    name: Dumbbell step-up
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    equipment: [dumbbells]
    also_needs: Step or bench
    difficulty: 3
    effectiveness: 4
    steps:
      - Hold a dumbbell in each hand and stand facing a sturdy step or bench.
      - Put one whole foot on the step.
      - Push through that foot to stand up on the step.
      - Lower yourself back down slowly with the same leg.
    cues:
      - Don't push off with the back foot.
      - Control the way down.
    common_mistake: Using a step so high that you have to jump off the floor to get up.
    harder: dumbbell-bulgarian-split-squat

  - slug: dumbbell-bulgarian-split-squat
    name: Dumbbell Bulgarian split squat
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    equipment: [dumbbells]
    also_needs: Bench or chair
    difficulty: 4
    effectiveness: 5
    not_suitable_for: [knees]
    steps:
      - Hold a dumbbell in each hand and stand a big step in front of a bench or chair.
      - Put the top of one foot on the bench behind you.
      - Lower your back knee towards the floor.
      - Push through your front foot to come back up.
    cues:
      - Most of your weight stays on the front leg.
      - Let the dumbbells hang straight down.
    common_mistake: Bouncing the back knee off the floor.

  - slug: smith-machine-split-squat
    name: Smith machine split squat
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    equipment: [gym]
    also_needs: Smith machine
    difficulty: 3
    effectiveness: 4
    steps:
      - Set the bar at shoulder height and rest it on your upper back.
      - Step one foot forward and one back, about a stride apart.
      - Lift the bar off the hooks and lower your back knee towards the floor.
      - Push through your front foot to come back up.
    cues:
      - Set the safety stops before you start.
      - Front foot slightly ahead of the bar.
    common_mistake: Feet too close together so the front knee is cramped.

  - slug: barbell-lunge
    name: Barbell lunge
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes, hamstrings]
    targets: [quads_vastus, glute_max, glute_med]
    equipment: [gym]
    also_needs: Barbell
    difficulty: 4
    effectiveness: 4
    not_suitable_for: [knees, back]
    steps:
      - Take the bar from the rack onto your upper back and step back.
      - Take a big step backwards with one foot.
      - Lower your back knee towards the floor.
      - Push through your front foot to step back to the start.
    cues:
      - Brace your stomach so you don't wobble.
      - Use a light bar until your balance is solid.
    common_mistake: Going heavy before the movement is steady.

  - slug: single-leg-leg-press
    name: Single-leg leg press
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus, glute_max, glute_med]
    equipment: [gym]
    also_needs: Machine
    difficulty: 2
    effectiveness: 4
    steps:
      - Sit in the leg press and put one foot in the middle of the plate.
      - Release the safety handles.
      - Lower the plate slowly by bending your knee.
      - Push it back up until your leg is almost straight.
    cues:
      - Use about half the weight you use with two legs.
      - Keep your lower back on the seat.
    common_mistake: Locking the knee straight at the top.

  - slug: side-lunge
    name: Side lunge
    category: legs
    movement_slot: single_leg
    exercise_type: compound
    primary_muscle: quads
    secondary_muscles: [adductors, glutes]
    targets: [adductors, quads_vastus, glute_max]
    difficulty: 2
    effectiveness: 3
    not_suitable_for: [knees]
    steps:
      - Stand with your feet together.
      - Take a big step out to the side.
      - Bend that knee and sit your hips back, keeping the other leg straight.
      - Push off the bent leg to come back to the start.
    cues:
      - Keep both feet pointing forward.
      - Keep your chest up.
    common_mistake: Letting the bent knee cave inwards.

  # --- Hinge -------------------------------------------------------------------------

  - slug: wall-hip-hinge-drill
    name: Wall hip hinge drill
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes]
    targets: [hamstrings_hip, glute_max]
    also_needs: Wall
    difficulty: 1
    effectiveness: 2
    steps:
      - Stand with your back to a wall, about a foot away from it.
      - Keep your knees soft and push your hips back until they touch the wall.
      - Squeeze your bottom to stand back up tall.
    cues:
      - Your back stays flat like a table.
      - Move from the hips, not by bending your back.
    common_mistake: Bending your knees into a squat instead of pushing your hips back.
    harder: bodyweight-good-morning

  - slug: bodyweight-good-morning
    name: Bodyweight good morning
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes, back]
    targets: [hamstrings_hip, glute_max]
    difficulty: 1
    effectiveness: 2
    steps:
      - Stand with your feet hip-width apart and your hands behind your head.
      - Keep your knees slightly bent and push your hips back.
      - Lean your chest forward until you feel a stretch in the back of your legs.
      - Squeeze your bottom to stand back up.
    cues:
      - Keep your back flat the whole time.
      - Go only as low as your back stays flat.
    common_mistake: Rounding your back to reach lower.
    harder: single-leg-romanian-deadlift

  - slug: single-leg-romanian-deadlift
    name: Single-leg Romanian deadlift
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes]
    targets: [hamstrings_hip, glute_max]
    difficulty: 3
    effectiveness: 3
    steps:
      - Stand on one leg with a slight bend in the knee.
      - Lean your chest forward while your other leg lifts straight behind you.
      - Go down until your body is nearly level with the floor or you feel a strong stretch.
      - Squeeze your bottom to come back up.
    cues:
      - Keep your hips level; don't let them twist open.
      - Hold a wall lightly if balance is hard.
    common_mistake: Rounding your back to reach the floor.

  - slug: band-pull-through
    name: Band pull-through
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    equipment: [resistance_bands]
    also_needs: Low anchor
    difficulty: 2
    effectiveness: 3
    steps:
      - Tie the band low behind you and stand facing away, holding the band between your legs.
      - Walk forward until the band is tight.
      - Push your hips back and let your hands go between your legs.
      - Squeeze your bottom to drive your hips forward and stand tall.
    cues:
      - Arms stay straight; your hips do the work.
      - Stand fully tall at the top.
    common_mistake: Squatting down instead of pushing the hips back.

  - slug: band-romanian-deadlift
    name: Band Romanian deadlift
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes, back]
    targets: [hamstrings_hip, glute_max]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    steps:
      - Stand on the middle of the band and hold the ends in front of your thighs.
      - Keep your knees slightly bent and push your hips back.
      - Lower your hands down your legs until you feel a stretch in the back of your legs.
      - Squeeze your bottom to stand back up.
    cues:
      - Keep your back flat.
      - Hands stay close to your legs.
    common_mistake: Bending your knees so much it turns into a squat.

  - slug: band-good-morning
    name: Band good morning
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes, back]
    targets: [hamstrings_hip, glute_max]
    equipment: [resistance_bands]
    difficulty: 2
    effectiveness: 3
    not_suitable_for: [back]
    steps:
      - Stand on the band and loop the other end behind your neck, resting on your upper back.
      - Keep your knees slightly bent and push your hips back.
      - Lean forward until you feel a stretch in the back of your legs.
      - Squeeze your bottom to stand back up.
    cues:
      - Keep your back flat.
      - Use a light band; this is about control.
    common_mistake: Rounding your upper back as you lean forward.

  - slug: dumbbell-romanian-deadlift
    name: Dumbbell Romanian deadlift
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes, back]
    targets: [hamstrings_hip, glute_max]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 5
    steps:
      - Stand holding a dumbbell in each hand in front of your thighs.
      - Keep your knees slightly bent and push your hips back.
      - Slide the dumbbells down your legs until you feel a strong stretch in the back of your legs.
      - Squeeze your bottom to stand back up.
    cues:
      - Keep your back flat and the dumbbells close to your legs.
      - Your hips move back, not down.
    common_mistake: Rounding your back to reach the dumbbells lower.
    harder: single-leg-dumbbell-romanian-deadlift

  - slug: single-leg-dumbbell-romanian-deadlift
    name: Single-leg dumbbell Romanian deadlift
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes]
    targets: [hamstrings_hip, glute_max]
    equipment: [dumbbells]
    difficulty: 4
    effectiveness: 4
    steps:
      - Hold a dumbbell in the hand opposite your standing leg.
      - Lean your chest forward while your other leg lifts straight behind you.
      - Lower the dumbbell towards the floor until you feel a strong stretch.
      - Squeeze your bottom to come back up.
    cues:
      - Keep your hips level.
      - Move slowly; balance is part of the exercise.
    common_mistake: Twisting your hips open as the back leg lifts.

  - slug: back-extension
    name: Back extension
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [glutes, hamstrings]
    targets: [spinal_erectors, glute_max, hamstrings_hip]
    equipment: [gym]
    also_needs: Back extension bench
    difficulty: 1
    effectiveness: 3
    steps:
      - Set the pad just below your hip bones and hook your feet under the foot pads.
      - Cross your arms on your chest.
      - Lower your upper body forward slowly.
      - Squeeze your bottom and lower back to lift until your body is in a straight line.
    cues:
      - Stop at a straight line; don't arch backwards.
      - Move slowly in both directions.
    common_mistake: Swinging up fast and over-arching at the top.

  - slug: cable-pull-through
    name: Cable pull-through
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 3
    steps:
      - Attach a rope to the low cable and stand facing away, holding the rope between your legs.
      - Walk forward until there is tension.
      - Push your hips back and let the rope go between your legs.
      - Squeeze your bottom to drive your hips forward and stand tall.
    cues:
      - Arms stay straight.
      - Your hips do all the work.
    common_mistake: Pulling with your arms instead of driving with your hips.

  - slug: barbell-romanian-deadlift
    name: Barbell Romanian deadlift
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: hamstrings
    secondary_muscles: [glutes, back]
    targets: [hamstrings_hip, glute_max]
    equipment: [gym]
    also_needs: Barbell
    difficulty: 3
    effectiveness: 5
    not_suitable_for: [back]
    steps:
      - Hold the bar in front of your thighs, hands just outside your legs.
      - Keep your knees slightly bent and push your hips back.
      - Slide the bar down your legs until you feel a strong stretch in the back of your legs.
      - Squeeze your bottom to stand back up.
    cues:
      - The bar stays touching or almost touching your legs.
      - Back flat, shoulders pulled back.
    common_mistake: Letting the bar drift away from your legs, which pulls on your lower back.
    harder: trap-bar-deadlift

  - slug: trap-bar-deadlift
    name: Trap-bar deadlift
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings, quads, back, traps]
    targets: [glute_max, hamstrings_hip, spinal_erectors, upper_traps]
    equipment: [gym]
    also_needs: Trap bar
    difficulty: 3
    effectiveness: 5
    not_suitable_for: [back]
    steps:
      - Step inside the trap bar with your feet hip-width apart.
      - Bend your hips and knees and grip the handles.
      - Brace your stomach, push the floor away and stand up tall.
      - Lower the bar back down with control.
    cues:
      - Chest up, back flat before you lift.
      - Push through your whole foot.
    common_mistake: Jerking the bar off the floor instead of pushing smoothly.
    harder: barbell-deadlift

  - slug: barbell-deadlift
    name: Barbell deadlift
    category: legs
    movement_slot: hinge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings, back, traps]
    targets: [glute_max, hamstrings_hip, spinal_erectors, upper_traps]
    equipment: [gym]
    also_needs: Barbell
    difficulty: 5
    effectiveness: 5
    not_suitable_for: [back]
    steps:
      - Stand with the bar over the middle of your feet, feet hip-width apart.
      - Bend down and grip the bar just outside your legs.
      - Brace your stomach, pull your chest up and push the floor away to stand tall.
      - Lower the bar back down the same way, keeping it close to your legs.
    cues:
      - Back flat from start to finish.
      - The bar stays touching your legs.
    common_mistake: Rounding your lower back to lift the bar.

  # --- Bridge ------------------------------------------------------------------------

  - slug: glute-bridge
    name: Glute bridge
    category: legs
    movement_slot: bridge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    difficulty: 1
    effectiveness: 3
    steps:
      - Lie on your back with your knees bent and feet flat on the floor.
      - Squeeze your bottom and lift your hips until your body is in a straight line from knees to shoulders.
      - Hold for a second at the top.
      - Lower your hips slowly back down.
    cues:
      - Push through your heels.
      - Squeeze your bottom, not your lower back.
    common_mistake: Arching your lower back at the top instead of squeezing your bottom.
    harder: single-leg-glute-bridge

  - slug: single-leg-glute-bridge
    name: Single-leg glute bridge
    category: legs
    movement_slot: bridge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    difficulty: 2
    effectiveness: 3
    steps:
      - Lie on your back with one knee bent and that foot flat on the floor.
      - Lift the other leg straight up or hold the knee to your chest.
      - Push through the heel on the floor to lift your hips.
      - Lower your hips slowly back down.
    cues:
      - Keep your hips level; don't let one side drop.
      - Squeeze your bottom at the top.
    common_mistake: Twisting your hips to one side as you lift.
    harder: hip-thrust

  - slug: hip-thrust
    name: Hip thrust
    category: legs
    movement_slot: bridge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    also_needs: Sofa or bench
    difficulty: 2
    effectiveness: 4
    steps:
      - Sit on the floor with your upper back against the edge of a sofa or bench.
      - Bend your knees and put your feet flat on the floor.
      - Push through your heels and lift your hips until your body is flat like a table.
      - Lower your hips slowly back down.
    cues:
      - Tuck your chin and look forward, not at the ceiling.
      - Shins are straight up and down at the top.
    common_mistake: Over-arching your lower back at the top.
    harder: single-leg-hip-thrust

  - slug: single-leg-hip-thrust
    name: Single-leg hip thrust
    category: legs
    movement_slot: bridge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    also_needs: Sofa or bench
    difficulty: 3
    effectiveness: 4
    steps:
      - Rest your upper back on the edge of a sofa or bench.
      - Put one foot flat on the floor and lift the other.
      - Push through the heel on the floor to lift your hips.
      - Lower your hips slowly back down.
    cues:
      - Keep your hips level.
      - Squeeze your bottom at the top.
    common_mistake: Letting the sofa or bench slide away. Make sure it's stable first.

  - slug: banded-glute-bridge
    name: Banded glute bridge
    category: legs
    movement_slot: bridge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    equipment: [resistance_bands]
    difficulty: 1
    effectiveness: 3
    steps:
      - Lie on your back, knees bent, and hold a band across your hips with the ends pinned to the floor.
      - Push through your heels to lift your hips against the band.
      - Squeeze your bottom at the top.
      - Lower your hips slowly back down.
    cues:
      - Keep the band tight against your hips.
      - Push through your heels.
    common_mistake: Arching your lower back instead of squeezing your bottom.

  - slug: banded-side-walk
    name: Banded side walk
    category: legs
    movement_slot: bridge
    exercise_type: isolation
    primary_muscle: glutes
    targets: [glute_med]
    equipment: [resistance_bands]
    also_needs: Loop band
    difficulty: 1
    effectiveness: 3
    steps:
      - Put a loop band around your legs just above your knees or around your ankles.
      - Bend your knees a little and push your hips back slightly.
      - Take small steps sideways, keeping tension on the band.
      - Walk the same number of steps back the other way.
    cues:
      - Toes point forward.
      - Don't let your feet come together.
    common_mistake: Standing up straight and swinging the legs instead of staying low.

  - slug: band-kickback
    name: Band kickback
    category: legs
    movement_slot: bridge
    exercise_type: isolation
    primary_muscle: glutes
    targets: [glute_max]
    equipment: [resistance_bands]
    difficulty: 1
    effectiveness: 2
    steps:
      - Loop the band around one ankle and hold the other end under your hands on all fours, or tie it low.
      - Keep your knee bent and push your foot back and up towards the ceiling.
      - Squeeze your bottom at the top.
      - Lower your leg slowly back down.
    cues:
      - Keep your back flat.
      - Move only the leg.
    common_mistake: Arching your lower back to lift the leg higher.

  - slug: dumbbell-hip-thrust
    name: Dumbbell hip thrust
    category: legs
    movement_slot: bridge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    equipment: [dumbbells]
    also_needs: Sofa or bench
    difficulty: 2
    effectiveness: 4
    steps:
      - Rest your upper back on the edge of a sofa or bench and place a dumbbell on your hips.
      - Hold the dumbbell in place with both hands.
      - Push through your heels and lift your hips until your body is flat like a table.
      - Lower your hips slowly back down.
    cues:
      - Tuck your chin and look forward.
      - Pause at the top.
    common_mistake: Letting the dumbbell roll; keep both hands on it.

  - slug: barbell-hip-thrust
    name: Barbell hip thrust
    category: legs
    movement_slot: bridge
    exercise_type: compound
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    targets: [glute_max]
    equipment: [gym]
    also_needs: Barbell, bench
    difficulty: 3
    effectiveness: 5
    steps:
      - Sit with your upper back against a bench and roll a padded bar over your hips.
      - Bend your knees and put your feet flat on the floor.
      - Push through your heels and lift your hips until your body is flat like a table.
      - Lower your hips slowly back down.
    cues:
      - Use a bar pad or folded towel over your hips.
      - Chin tucked, eyes forward.
    common_mistake: Pushing through your toes instead of your heels.

  - slug: cable-kickback
    name: Cable kickback
    category: legs
    movement_slot: bridge
    exercise_type: isolation
    primary_muscle: glutes
    targets: [glute_max]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 3
    steps:
      - Attach an ankle strap to the low cable and strap it around one ankle.
      - Face the machine and hold it for support.
      - Push your leg straight back behind you.
      - Return slowly to the start.
    cues:
      - Keep your upper body still.
      - Squeeze your bottom at the back.
    common_mistake: Arching your back to swing the leg further.

  - slug: hip-abduction-machine
    name: Hip abduction machine
    category: legs
    movement_slot: bridge
    exercise_type: isolation
    primary_muscle: glutes
    targets: [glute_med]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 3
    steps:
      - Sit in the machine with the pads against the outside of your knees.
      - Push your knees out against the pads as far as you comfortably can.
      - Return slowly to the start.
    cues:
      - Sit tall against the back rest.
      - Pause for a second at the widest point.
    common_mistake: Letting the weights slam back together.

  # --- Leg curl ----------------------------------------------------------------------

  - slug: towel-sliding-leg-curl
    name: Towel sliding leg curl
    category: legs
    movement_slot: leg_curl
    exercise_type: isolation
    primary_muscle: hamstrings
    secondary_muscles: [glutes]
    targets: [hamstrings_knee]
    also_needs: Towel, smooth floor
    home_only: true
    difficulty: 2
    effectiveness: 3
    steps:
      - Lie on your back on a smooth floor with your heels on a towel.
      - Lift your hips into a bridge.
      - Slide your heels in towards your bottom, then slide them back out.
      - Keep your hips up the whole time.
    cues:
      - Squeeze your bottom to keep your hips high.
      - Slide out slowly; that part is the hardest.
    common_mistake: Letting your hips drop to the floor between reps.
    harder: single-leg-sliding-leg-curl

  - slug: single-leg-sliding-leg-curl
    name: Single-leg sliding leg curl
    category: legs
    movement_slot: leg_curl
    exercise_type: isolation
    primary_muscle: hamstrings
    secondary_muscles: [glutes]
    targets: [hamstrings_knee]
    also_needs: Towel, smooth floor
    home_only: true
    difficulty: 4
    effectiveness: 4
    steps:
      - Lie on your back on a smooth floor with one heel on a towel and the other leg lifted.
      - Lift your hips into a bridge.
      - Slide the heel in towards your bottom, then slide it back out.
      - Keep your hips up and level.
    cues:
      - Go slowly on the way out.
      - Keep your hips level.
    common_mistake: Letting your hips drop and twist.
    harder: assisted-nordic-curl

  - slug: assisted-nordic-curl
    name: Assisted Nordic curl
    category: legs
    movement_slot: leg_curl
    exercise_type: isolation
    primary_muscle: hamstrings
    targets: [hamstrings_knee]
    also_needs: Feet anchored
    difficulty: 5
    effectiveness: 5
    steps:
      - Kneel on a soft mat and anchor your heels under a sofa or have someone hold them.
      - Keep your body straight from knees to head.
      - Lean forward as slowly as you can, using the backs of your legs to resist.
      - Catch yourself with your hands and push back up to the start.
    cues:
      - Keep your hips straight; don't bend at the waist.
      - Fight the fall for as long as you can.
    common_mistake: Bending at the hips to make it easier.

  - slug: lying-band-leg-curl
    name: Lying band leg curl
    category: legs
    movement_slot: leg_curl
    exercise_type: isolation
    primary_muscle: hamstrings
    targets: [hamstrings_knee]
    equipment: [resistance_bands]
    also_needs: Low anchor
    difficulty: 2
    effectiveness: 3
    steps:
      - Tie the band low and lie face down with the band around your ankles.
      - Bend your knees to pull your heels towards your bottom.
      - Squeeze at the top.
      - Lower your legs slowly back down.
    cues:
      - Keep your hips pressed into the floor.
      - Move slowly in both directions.
    common_mistake: Lifting your hips off the floor to pull harder.

  - slug: leg-curl-machine
    name: Leg curl machine
    category: legs
    movement_slot: leg_curl
    exercise_type: isolation
    primary_muscle: hamstrings
    targets: [hamstrings_knee]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 5
    steps:
      - Set the pad so it rests just above your heels.
      - Sit or lie in the machine and hold the handles.
      - Bend your knees to pull the pad towards your bottom.
      - Return slowly to the start.
    cues:
      - Keep your hips down on the seat or bench.
      - Lower slowly; don't let the weight drop.
    common_mistake: Lifting your hips to swing the weight.

  # --- Leg extension -----------------------------------------------------------------

  - slug: wall-sit
    name: Wall sit
    category: legs
    movement_slot: leg_extension
    exercise_type: isolation
    primary_muscle: quads
    secondary_muscles: [glutes]
    targets: [quads_vastus]
    also_needs: Wall
    difficulty: 1
    effectiveness: 2
    is_timed: true
    steps:
      - Stand with your back flat against a wall.
      - Slide down until your knees are bent at about a right angle.
      - Hold this position for the set time.
    cues:
      - Keep your knees above your ankles.
      - Breathe normally; don't hold your breath.
    common_mistake: Going lower than is comfortable for your knees.
    harder: assisted-sissy-squat

  - slug: assisted-sissy-squat
    name: Assisted sissy squat
    category: legs
    movement_slot: leg_extension
    exercise_type: isolation
    primary_muscle: quads
    targets: [rectus_femoris]
    also_needs: Support to hold
    difficulty: 4
    effectiveness: 3
    not_suitable_for: [knees]
    steps:
      - Hold onto a door frame or post with one hand.
      - Rise onto your toes and lean your body back as you bend your knees forward.
      - Lower as far as you can control, keeping a straight line from knees to head.
      - Push back up to the start.
    cues:
      - Use the support as much as you need.
      - Move slowly.
    common_mistake: Bending at the hips so it turns into a normal squat.

  - slug: band-leg-extension
    name: Band leg extension
    category: legs
    movement_slot: leg_extension
    exercise_type: isolation
    primary_muscle: quads
    targets: [rectus_femoris, quads_vastus]
    equipment: [resistance_bands]
    also_needs: Anchor, chair
    difficulty: 1
    effectiveness: 2
    not_suitable_for: [knees]
    steps:
      - Sit on a chair and tie the band behind the chair leg, looped around one ankle.
      - Straighten your knee to lift your foot forward against the band.
      - Squeeze at the top.
      - Lower your foot slowly back down.
    cues:
      - Sit tall.
      - Use a light band and high reps.
    common_mistake: Kicking the leg up fast instead of lifting it with control.

  - slug: leg-extension-machine
    name: Leg extension machine
    category: legs
    movement_slot: leg_extension
    exercise_type: isolation
    primary_muscle: quads
    targets: [rectus_femoris, quads_vastus]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    not_suitable_for: [knees]
    steps:
      - Sit in the machine with the pad on the front of your ankles.
      - Hold the handles.
      - Straighten your knees to lift the pad.
      - Lower it slowly back down.
    cues:
      - Pause for a second at the top.
      - Keep your back against the seat.
    common_mistake: Kicking the weight up and letting it drop.

  # --- Calves ------------------------------------------------------------------------

  - slug: calf-raise
    name: Calf raise
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [gastrocnemius]
    difficulty: 1
    effectiveness: 3
    steps:
      - Stand tall with your feet hip-width apart, holding a wall for balance.
      - Rise up onto your toes as high as you can.
      - Pause at the top.
      - Lower your heels slowly back down.
    cues:
      - Pause at the top and at the bottom.
      - Keep your knees straight.
    common_mistake: Bouncing quickly instead of moving slowly.
    harder: single-leg-calf-raise

  - slug: single-leg-calf-raise
    name: Single-leg calf raise
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [gastrocnemius]
    also_needs: Step
    difficulty: 2
    effectiveness: 4
    steps:
      - Stand on one foot on the edge of a step, holding a wall for balance.
      - Let your heel drop below the step.
      - Rise up onto your toes as high as you can.
      - Lower your heel slowly back below the step.
    cues:
      - Use the full range, from deep stretch to high on your toes.
      - Hold on just for balance.
    common_mistake: Rushing the reps so the calf never stretches.

  - slug: dumbbell-calf-raise
    name: Dumbbell calf raise
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [gastrocnemius]
    equipment: [dumbbells]
    also_needs: Step
    difficulty: 2
    effectiveness: 4
    steps:
      - Hold a dumbbell in one hand and stand on the edge of a step.
      - Hold a wall with your free hand.
      - Let your heels drop, then rise onto your toes as high as you can.
      - Lower slowly back down.
    cues:
      - Pause at the top.
      - Do one leg at a time if the dumbbell is light.
    common_mistake: Bending your knees to bounce the weight up.

  - slug: standing-calf-raise-machine
    name: Standing calf raise machine
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [gastrocnemius]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 5
    steps:
      - Stand in the machine with the pads on your shoulders and the balls of your feet on the edge.
      - Let your heels drop below the edge.
      - Rise up onto your toes as high as you can.
      - Lower slowly back down.
    cues:
      - Keep your knees straight but not locked.
      - Pause at the top and the bottom.
    common_mistake: Bouncing at the bottom.

  - slug: leg-press-calf-raise
    name: Leg press calf raise
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [gastrocnemius]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Sit in the leg press with only the balls of your feet on the bottom edge of the plate.
      - Keep your legs straight with a soft knee.
      - Push the plate away by pointing your toes.
      - Let your heels come back slowly.
    cues:
      - Keep the safety handles locked unless you're sure of the weight.
      - Pause at the top.
    common_mistake: Bending your knees and turning it into a leg press.

  - slug: bent-knee-calf-raise
    name: Bent-knee calf raise
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [soleus]
    difficulty: 2
    effectiveness: 2
    steps:
      - Stand with your feet hip-width apart, holding a wall for balance.
      - Bend your knees a little into a quarter squat and hold that.
      - Rise up onto your toes, then lower slowly.
    cues:
      - Keep the knee bend the same the whole time.
      - Pause at the top.
    common_mistake: Straightening your knees as you rise.

  - slug: seated-dumbbell-calf-raise
    name: Seated dumbbell calf raise
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [soleus]
    equipment: [dumbbells]
    also_needs: Chair
    difficulty: 1
    effectiveness: 3
    steps:
      - Sit on a chair with your feet flat and a dumbbell resting on each knee.
      - Rise up onto your toes as high as you can.
      - Pause, then lower your heels slowly.
    cues:
      - Put a book under your toes for a bigger range.
      - Hold the dumbbells still on your knees.
    common_mistake: Rushing the reps.

  - slug: seated-calf-raise-machine
    name: Seated calf raise machine
    category: legs
    movement_slot: calves
    exercise_type: isolation
    primary_muscle: calves
    targets: [soleus]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 5
    steps:
      - Sit in the machine with the pads on your thighs and the balls of your feet on the edge.
      - Release the safety lever.
      - Let your heels drop, then rise onto your toes as high as you can.
      - Lower slowly back down.
    cues:
      - Pause at the top and the bottom.
      - Keep the movement slow.
    common_mistake: Bouncing at the bottom.

  # --- Adductors ---------------------------------------------------------------------

  - slug: copenhagen-side-plank
    name: Copenhagen side plank
    category: legs
    movement_slot: adductors
    exercise_type: isolation
    primary_muscle: adductors
    secondary_muscles: [core]
    targets: [adductors]
    also_needs: Chair or sofa
    difficulty: 3
    effectiveness: 4
    is_timed: true
    steps:
      - Lie on your side and put your top knee on a chair or sofa.
      - Lean on your bottom elbow.
      - Lift your hips until your body is in a straight line.
      - Hold for the set time, then switch sides.
    cues:
      - Start with short holds.
      - Keep your hips stacked.
    common_mistake: Letting your hips sag towards the floor.

  - slug: hip-adduction-machine
    name: Hip adduction machine
    category: legs
    movement_slot: adductors
    exercise_type: isolation
    primary_muscle: adductors
    targets: [adductors]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    steps:
      - Sit in the machine with the pads against the inside of your knees.
      - Squeeze your knees together.
      - Let them open back out slowly.
    cues:
      - Sit tall.
      - Go slowly on the way out.
    common_mistake: Letting the weights slam back.

  # ===================================================================================
  # CORE
  # ===================================================================================

  # --- Brace -------------------------------------------------------------------------

  - slug: dead-bug
    name: Dead bug
    category: core
    movement_slot: brace
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [glutes]
    targets: [upper_abs, lower_abs, deep_core]
    difficulty: 1
    effectiveness: 4
    steps:
      - Lie on your back with your arms pointing at the ceiling and your knees bent above your hips.
      - Press your lower back gently into the floor.
      - Slowly lower one arm behind your head and the opposite leg towards the floor.
      - Bring them back and repeat on the other side.
    cues:
      - Your lower back stays touching the floor.
      - Breathe out as you lower.
    common_mistake: Letting your lower back arch off the floor.
    harder: knee-plank

  - slug: knee-plank
    name: Knee plank
    category: core
    movement_slot: brace
    exercise_type: isolation
    primary_muscle: core
    targets: [upper_abs, lower_abs, deep_core]
    difficulty: 1
    effectiveness: 2
    is_timed: true
    steps:
      - Lie face down and rest on your forearms, elbows under your shoulders.
      - Lift your hips so your body is straight from knees to head.
      - Hold for the set time.
    cues:
      - Squeeze your stomach and bottom.
      - Breathe normally.
    common_mistake: Pushing your hips up into the air.
    harder: plank

  - slug: plank
    name: Plank
    category: core
    movement_slot: brace
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [shoulders, glutes]
    targets: [upper_abs, lower_abs, deep_core]
    difficulty: 2
    effectiveness: 3
    is_timed: true
    steps:
      - Rest on your forearms with your elbows under your shoulders.
      - Step your feet back so your body is straight from heels to head.
      - Hold for the set time.
    cues:
      - Squeeze your stomach and bottom.
      - Look at the floor just in front of your hands.
    common_mistake: Letting your hips sag towards the floor.
    harder: plank-shoulder-taps

  - slug: plank-shoulder-taps
    name: Plank shoulder taps
    category: core
    movement_slot: brace
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [shoulders]
    targets: [upper_abs, lower_abs, deep_core]
    difficulty: 3
    effectiveness: 4
    steps:
      - Start in a push-up position with your feet a little wider than your hips.
      - Lift one hand and tap the opposite shoulder.
      - Put it back down and tap with the other hand.
    cues:
      - Keep your hips still; don't rock side to side.
      - Go slowly.
    common_mistake: Swaying your hips with every tap.
    harder: long-lever-plank

  - slug: long-lever-plank
    name: Long-lever plank
    category: core
    movement_slot: brace
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [shoulders]
    targets: [upper_abs, lower_abs, deep_core]
    difficulty: 4
    effectiveness: 4
    is_timed: true
    steps:
      - Get into a forearm plank.
      - Walk your elbows forward a few centimetres in front of your shoulders.
      - Hold for the set time.
    cues:
      - The further forward your elbows, the harder it gets.
      - Squeeze your stomach and bottom hard.
    common_mistake: Letting your lower back sag.

  - slug: ab-wheel-rollout
    name: Ab wheel rollout
    category: core
    movement_slot: brace
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [shoulders, back]
    targets: [upper_abs, lower_abs, deep_core]
    equipment: [gym]
    also_needs: Ab wheel
    difficulty: 5
    effectiveness: 5
    not_suitable_for: [back]
    steps:
      - Kneel on a soft mat and hold the ab wheel under your shoulders.
      - Roll the wheel forward slowly, letting your hips follow.
      - Go only as far as you can keep your back flat.
      - Pull the wheel back to your knees using your stomach.
    cues:
      - Squeeze your stomach and bottom the whole time.
      - Start with short rollouts.
    common_mistake: Letting your lower back sag as you roll out.

  # --- Curl --------------------------------------------------------------------------

  - slug: crunch
    name: Crunch
    category: core
    movement_slot: ab_curl
    exercise_type: isolation
    primary_muscle: core
    targets: [upper_abs]
    difficulty: 1
    effectiveness: 3
    steps:
      - Lie on your back with your knees bent and your hands lightly beside your head.
      - Curl your shoulders off the floor, bringing your ribs towards your hips.
      - Lower back down slowly.
    cues:
      - It's a small movement.
      - Don't pull on your neck.
    common_mistake: Yanking your head forward with your hands.
    harder: reverse-crunch

  - slug: reverse-crunch
    name: Reverse crunch
    category: core
    movement_slot: ab_curl
    exercise_type: isolation
    primary_muscle: core
    targets: [lower_abs]
    difficulty: 2
    effectiveness: 4
    steps:
      - Lie on your back with your knees bent above your hips and your arms by your sides.
      - Curl your hips off the floor, bringing your knees towards your chest.
      - Lower your hips back down slowly.
    cues:
      - Lift with your stomach, not by swinging your legs.
      - Go slowly on the way down.
    common_mistake: Swinging your legs to throw your hips up.
    harder: bicycle-crunch

  - slug: bicycle-crunch
    name: Bicycle crunch
    category: core
    movement_slot: ab_curl
    exercise_type: isolation
    primary_muscle: core
    targets: [upper_abs, obliques]
    difficulty: 2
    effectiveness: 4
    steps:
      - Lie on your back with your hands lightly beside your head and your knees bent above your hips.
      - Bring one elbow towards the opposite knee while the other leg straightens.
      - Switch sides in a slow pedalling motion.
    cues:
      - Turn your shoulder, not just your elbow.
      - Slow and controlled beats fast.
    common_mistake: Going so fast that you just flap your elbows.
    harder: lying-leg-raise

  - slug: lying-leg-raise
    name: Lying leg raise
    category: core
    movement_slot: ab_curl
    exercise_type: isolation
    primary_muscle: core
    targets: [lower_abs]
    difficulty: 3
    effectiveness: 4
    not_suitable_for: [back]
    steps:
      - Lie on your back with your legs straight and your hands under your bottom.
      - Press your lower back into the floor.
      - Lift your legs until they point at the ceiling.
      - Lower them slowly, stopping before your back arches.
    cues:
      - Lower back stays on the floor.
      - Bend your knees to make it easier.
    common_mistake: Lowering your legs so far that your lower back lifts.

  - slug: hanging-knee-raise
    name: Hanging knee raise
    category: core
    movement_slot: ab_curl
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [forearms]
    targets: [lower_abs]
    equipment: [pull_up_bar]
    difficulty: 3
    effectiveness: 5
    steps:
      - Hang from the pull-up bar with straight arms.
      - Lift your knees up towards your chest.
      - Lower them slowly.
    cues:
      - No swinging; pause at the bottom if needed.
      - Curl your hips up at the top.
    common_mistake: Swinging your body to throw the knees up.
    harder: hanging-leg-raise

  - slug: hanging-leg-raise
    name: Hanging leg raise
    category: core
    movement_slot: ab_curl
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [forearms]
    targets: [lower_abs]
    equipment: [pull_up_bar]
    difficulty: 5
    effectiveness: 5
    steps:
      - Hang from the pull-up bar with straight arms.
      - Keep your legs straight and lift them to hip height or higher.
      - Lower them slowly.
    cues:
      - No swinging.
      - Curl your hips up at the top.
    common_mistake: Using momentum instead of your stomach.

  - slug: cable-crunch
    name: Cable crunch
    category: core
    movement_slot: ab_curl
    exercise_type: isolation
    primary_muscle: core
    targets: [upper_abs]
    equipment: [gym]
    also_needs: Cable, rope
    difficulty: 2
    effectiveness: 5
    steps:
      - Attach a rope to the high cable and kneel facing it, holding the rope beside your head.
      - Curl your chest down towards your knees, rounding your back.
      - Come back up slowly.
    cues:
      - Your hips stay still; your stomach does the curling.
      - Keep your hands beside your head.
    common_mistake: Sitting back on your heels to pull with your body weight.

  # --- Side and rotation -------------------------------------------------------------

  - slug: bird-dog
    name: Bird dog
    category: core
    movement_slot: side_and_rotation
