      - Reach one arm forward and the opposite leg back until both are straight.
      - Hold for a second, then bring them back.
      - Repeat on the other side.
    cues:
      - Keep your back flat; imagine a cup of tea on it.
      - Move slowly.
    common_mistake: Lifting the leg too high and arching your back.
    harder: knee-side-plank

  - slug: knee-side-plank
    name: Knee side plank
    category: core
    movement_slot: side_and_rotation
    exercise_type: isolation
    primary_muscle: core
    targets: [obliques]
    difficulty: 1
    effectiveness: 3
    is_timed: true
    steps:
      - Lie on your side with your knees bent and rest on your bottom elbow.
      - Lift your hips so your body is straight from knees to head.
      - Hold for the set time, then switch sides.
    cues:
      - Elbow under your shoulder.
      - Push your hips forward a little.
    common_mistake: Letting your hips sag towards the floor.
    harder: side-plank

  - slug: side-plank
    name: Side plank
    category: core
    movement_slot: side_and_rotation
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [shoulders, glutes]
    targets: [obliques]
    difficulty: 2
    effectiveness: 4
    is_timed: true
    steps:
      - Lie on your side with your legs straight and rest on your bottom elbow.
      - Lift your hips so your body is straight from head to feet.
      - Hold for the set time, then switch sides.
    cues:
      - Elbow under your shoulder.
      - Stack your feet or put one in front of the other.
    common_mistake: Letting your hips drop or push backwards.
    harder: side-plank-with-reach

  - slug: side-plank-with-reach
    name: Side plank with reach
    category: core
    movement_slot: side_and_rotation
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [shoulders]
    targets: [obliques]
    difficulty: 3
    effectiveness: 4
    steps:
      - Get into a side plank on your elbow.
      - Reach your top arm up to the ceiling.
      - Thread it under your body, turning your chest towards the floor.
      - Reach back up and repeat.
    cues:
      - Keep your hips up the whole time.
      - Move slowly.
    common_mistake: Letting your hips drop as you twist.

  - slug: russian-twist
    name: Russian twist
    category: core
    movement_slot: side_and_rotation
    exercise_type: isolation
    primary_muscle: core
    targets: [obliques]
    difficulty: 2
    effectiveness: 3
    not_suitable_for: [back]
    steps:
      - Sit with your knees bent, lean back a little and hold your hands together in front of your chest.
      - Turn your shoulders to one side.
      - Turn to the other side.
    cues:
      - Turn your shoulders, not just your arms.
      - Keep your chest up.
    common_mistake: Rounding your back and swinging your arms fast.

  - slug: band-pallof-press
    name: Band Pallof press
    category: core
    movement_slot: side_and_rotation
    exercise_type: isolation
    primary_muscle: core
    targets: [obliques]
    equipment: [resistance_bands]
    also_needs: Side anchor
    difficulty: 2
    effectiveness: 4
    steps:
      - Tie the band at chest height beside you and hold the end with both hands at your chest.
      - Step away until the band is tight.
      - Push your hands straight out in front of you and hold for two seconds.
      - Bring them back to your chest.
    cues:
      - Don't let the band turn you.
      - Stand tall with your stomach tight.
    common_mistake: Standing too close so there's no tension.

  - slug: cable-woodchop
    name: Cable woodchop
    category: core
    movement_slot: side_and_rotation
    exercise_type: isolation
    primary_muscle: core
    secondary_muscles: [shoulders]
    targets: [obliques]
    equipment: [gym]
    also_needs: Cable
    difficulty: 2
    effectiveness: 4
    steps:
      - Set the pulley high and hold the handle with both hands, standing side-on.
      - Pull the handle down and across your body to the opposite hip.
      - Let it go back up slowly.
    cues:
      - Turn through your hips and chest together.
      - Keep your arms almost straight.
    common_mistake: Twisting from your lower back alone.

  # --- Lower back --------------------------------------------------------------------

  - slug: superman
    name: Superman
    category: core
    movement_slot: lower_back
    exercise_type: isolation
    primary_muscle: back
    secondary_muscles: [glutes]
    targets: [spinal_erectors, glute_max]
    difficulty: 1
    effectiveness: 2
    not_suitable_for: [back]
