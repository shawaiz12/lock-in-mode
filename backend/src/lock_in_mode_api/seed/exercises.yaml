      - Keep your arms straight and push your hands down to your thighs.
      - Let them come back up slowly.
    cues:
      - Arms stay straight the whole time.
      - Feel it under your armpits.
    common_mistake: Bending your elbows and turning it into a pushdown.

  - slug: dumbbell-pullover
    name: Dumbbell pullover
    category: pull
    movement_slot: vertical_pull
    exercise_type: isolation
    primary_muscle: back
    secondary_muscles: [chest]
    targets: [lats, chest_mid]
    equipment: [dumbbells]
    also_needs: Floor or bench
