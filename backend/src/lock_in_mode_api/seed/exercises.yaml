      - Lie on a bench or the floor holding one dumbbell with both hands above your chest.
      - Keep a slight bend in your elbows.
      - Lower the dumbbell back behind your head until you feel a stretch.
      - Pull it back up over your chest.
    cues:
      - Use a light dumbbell.
      - Move slowly; the stretch is the point.
    common_mistake: Lowering too far, which strains the shoulders.

  - slug: lat-pulldown
    name: Lat pulldown
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, traps]
    targets: [lats, lower_traps]
    equipment: [gym]
    also_needs: Cable machine
    difficulty: 1
    effectiveness: 5
    steps:
      - Adjust the knee pad so your legs are held firmly.
      - Grip the bar a little wider than your shoulders.
      - Pull the bar down to your upper chest.
      - Let it go back up slowly until your arms are straight.
    cues:
      - Lean back very slightly and keep your chest up.
      - Pull your elbows down to your ribs.
    common_mistake: Pulling the bar behind your neck.
    harder: assisted-pull-up-machine

  - slug: assisted-pull-up-machine
    name: Assisted pull-up machine
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, traps]
    targets: [lats, lower_traps]
    equipment: [gym]
    also_needs: Machine
    difficulty: 2
    effectiveness: 4
    steps:
      - Set the assistance weight; more weight makes it easier.
      - Kneel or stand on the platform and grip the handles.
      - Pull yourself up until your chin is over the handles.
      - Lower yourself slowly until your arms are straight.
    cues:
      - Lower the assistance as you get stronger.
      - Control the way down.
    common_mistake: Using so much assistance that it feels effortless.

  # --- Rear delt ---------------------------------------------------------------------

  - slug: prone-y-t-w-raise
    name: Prone Y-T-W raise
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    secondary_muscles: [back, traps]
    targets: [lower_traps, mid_back, delt_rear]
    difficulty: 1
    effectiveness: 3
    steps:
      - Lie face down with your arms stretched above your head in a Y shape, thumbs up.
      - Lift your arms off the floor, hold, then lower.
      - Move your arms out to the sides in a T and lift again.
      - Bend your elbows into a W and squeeze your shoulder blades together as you lift.
    cues:
      - Keep your forehead resting on a towel.
      - Small lifts are fine; squeeze your upper back.
    common_mistake: Lifting your chest high and arching your lower back.

  - slug: reverse-snow-angel
    name: Reverse snow angel
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    secondary_muscles: [back, traps]
    targets: [lower_traps, mid_back, delt_rear]
    difficulty: 1
    effectiveness: 2
    steps:
      - Lie face down with your arms by your sides, palms down, and lift them slightly off the floor.
      - Sweep your arms out wide and up above your head, like a snow angel.
      - Sweep them back down to your sides.
    cues:
      - Keep your arms hovering off the floor the whole time.
      - Move slowly.
    common_mistake: Rushing through the movement.

  - slug: band-pull-apart
    name: Band pull-apart
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    secondary_muscles: [back, traps]
    targets: [delt_rear, mid_back, lower_traps]
    equipment: [resistance_bands]
    difficulty: 1
    effectiveness: 4
    steps:
      - Hold the band in front of your chest with straight arms, hands shoulder-width apart.
      - Pull the band apart by moving your hands out to the sides.
      - Squeeze your shoulder blades together when the band touches your chest.
      - Let your hands come back together slowly.
    cues:
      - Keep your arms straight.
      - Shoulders stay down, away from your ears.
    common_mistake: Bending your elbows to make it easier.

  - slug: band-face-pull
    name: Band face pull
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    secondary_muscles: [back, traps]
    targets: [delt_rear, mid_back, lower_traps]
    equipment: [resistance_bands]
    also_needs: Anchor at face height
    difficulty: 2
    effectiveness: 4
    steps:
      - Anchor the band at face height and hold one end in each hand, arms straight.
      - Pull the band towards your forehead, elbows high and out to the sides.
      - Squeeze your shoulder blades together.
      - Let your arms straighten slowly.
    cues:
      - Elbows stay high, level with your shoulders.
      - Finish with your hands beside your ears.
    common_mistake: Pulling to your chest with low elbows, which turns it into a row.

  - slug: dumbbell-reverse-fly
    name: Dumbbell reverse fly
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    secondary_muscles: [back, traps]
    targets: [delt_rear, mid_back, lower_traps]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 4
    steps:
      - Hold a light dumbbell in each hand and lean forward with a flat back, or lie chest-down on an incline bench.
      - Let your arms hang down, palms facing each other.
      - Lift your arms out to the sides until they are level with your body.
      - Lower them slowly.
    cues:
      - Keep a slight bend in your elbows.
      - Use light dumbbells.
    common_mistake: Squeezing your shoulder blades so hard that your back does the work.

  - slug: cable-face-pull
    name: Cable face pull
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    secondary_muscles: [back, traps]
    targets: [delt_rear, mid_back, lower_traps]
    equipment: [gym]
    also_needs: Cable, rope
    difficulty: 2
    effectiveness: 5
    steps:
      - Attach a rope to the cable at face height and hold the ends with your palms facing down.
      - Step back until your arms are straight.
      - Pull the rope towards your forehead, pulling the ends apart.
      - Let your arms straighten slowly.
    cues:
      - Elbows high, level with your shoulders.
      - Finish with your hands beside your ears.
    common_mistake: Going so heavy that you lean back and row it.

  - slug: reverse-pec-deck
    name: Reverse pec deck
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    secondary_muscles: [back, traps]
    targets: [delt_rear, mid_back, lower_traps]
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 5
    steps:
      - Sit facing the pec deck with your chest on the pad.
      - Hold the handles with straight arms in front of you.
      - Open your arms out to the sides until they are level with your body.
      - Bring them back slowly.
    cues:
      - Keep a slight bend in your elbows.
      - Shoulders stay down.
    common_mistake: Shrugging your shoulders as you pull.

  - slug: band-external-rotation
    name: Band external rotation
    category: pull
    movement_slot: rear_delt
    exercise_type: isolation
    primary_muscle: shoulders
    targets: [delt_rear]
    equipment: [resistance_bands]
    also_needs: Side anchor
    difficulty: 1
    effectiveness: 3
    steps:
      - Tie the band at elbow height beside you and hold it in the hand furthest from the anchor.
      - Pin that elbow to your side, bent at a right angle, with your hand in front of your stomach.
      - Rotate your forearm outwards, away from your body.
      - Bring it back slowly.
    cues:
      - Your elbow stays pinned to your side.
      - Use a light band; it's a small movement.
    common_mistake: Letting your elbow drift away from your side.

  # --- Biceps ------------------------------------------------------------------------

