  - slug: band-lat-pulldown
    name: Band lat pulldown
    category: pull
    movement_slot: vertical_pull
    exercise_type: compound
    primary_muscle: back
    secondary_muscles: [biceps, traps]
    targets: [lats, lower_traps]
    equipment: [resistance_bands]
    also_needs: High anchor
    difficulty: 1
    effectiveness: 3
    steps:
      - Anchor the band over the top of a door and kneel facing it, holding one end in each hand.
      - Start with your arms straight up.
      - Pull your elbows down towards your ribs.
      - Let your arms go back up slowly.
    cues:
      - Lean back very slightly.
      - Squeeze your back at the bottom.
    common_mistake: Pulling with your arms only and shrugging your shoulders.

  - slug: band-straight-arm-pulldown
    name: Band straight-arm pulldown
    category: pull
