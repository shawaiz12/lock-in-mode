    category: core
    movement_slot: carry
    exercise_type: compound
    primary_muscle: core
    secondary_muscles: [forearms, back, traps]
    targets: [upper_traps, forearm_flexors, deep_core]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 4
    is_timed: true
    steps:
      - Pick up a heavy dumbbell in each hand.
      - Stand tall with your shoulders back.
      - Walk with short, steady steps for the set time or distance.
    cues:
      - Squeeze the handles hard.
      - Keep your chest up.
    common_mistake: Letting your shoulders round forward.

  - slug: suitcase-carry
    name: Suitcase carry
    category: core
    movement_slot: carry
    exercise_type: compound
    primary_muscle: core
    secondary_muscles: [forearms, traps]
    targets: [obliques, forearm_flexors, upper_traps]
    equipment: [dumbbells]
    difficulty: 2
    effectiveness: 4
    is_timed: true
    steps:
      - Pick up one heavy dumbbell in one hand.
      - Stand tall and walk for the set time or distance.
      - Switch hands and repeat.
    cues:
      - Stay perfectly upright.
      - Tighten your stomach.
    common_mistake: Leaning towards the weight.

  # ===================================================================================
  # CARDIO
  # ===================================================================================

  # --- Conditioning ------------------------------------------------------------------

  - slug: march-in-place
    name: March in place
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 2
    impact: low
    is_timed: true
    steps:
      - Stand tall.
      - March on the spot, lifting your knees and swinging your arms.
      - Keep going for the set time.
    cues:
      - Lift your knees higher to work harder.
      - Breathe steadily.
    common_mistake: Shuffling with tiny steps that barely raise the pulse.

  - slug: step-jacks
    name: Step jacks
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 2
    impact: low
    is_timed: true
    steps:
      - Stand with your feet together and arms by your sides.
      - Step one foot out to the side while raising both arms overhead.
      - Bring them back and step out with the other foot.
    cues:
      - Keep it quick but controlled.
      - No jumping needed.
    common_mistake: Moving so slowly that your heart rate doesn't rise.

  - slug: side-steps
    name: Side steps
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 2
    impact: low
    is_timed: true
    steps:
      - Stand with your knees slightly bent.
      - Step quickly to one side, bring your feet together, then step back.
      - Keep moving side to side for the set time.
    cues:
      - Stay light on your feet.
      - Swing your arms.
    common_mistake: Standing up straight and stiff.

  - slug: low-impact-high-knees
    name: Low-impact high knees
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 3
    impact: low
    is_timed: true
    steps:
      - Stand tall with your hands out in front at hip height.
      - Lift one knee up to your hand, then the other.
      - Keep one foot on the floor at all times and move quickly.
    cues:
      - Drive the knees up fast.
      - Stay on the balls of your feet.
    common_mistake: Leaning back as you lift your knees.

  - slug: shadow-boxing
    name: Shadow boxing
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 3
    impact: low
    is_timed: true
    steps:
      - Stand with one foot slightly in front of the other and your fists up by your chin.
      - Throw quick punches straight ahead, switching arms.
      - Keep moving your feet and punching for the set time.
    cues:
      - Turn your body a little with each punch.
      - Bring your fists back to your chin.
    common_mistake: Locking your elbows hard at the end of each punch.

  - slug: squat-to-reach
    name: Squat to reach
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 3
    impact: low
    is_timed: true
    steps:
      - Stand with your feet shoulder-width apart.
      - Squat down and touch your hands towards the floor.
      - Stand up quickly and reach both arms overhead.
    cues:
      - Keep a steady rhythm.
      - Heels stay on the floor.
    common_mistake: Rounding your back to reach the floor.

  - slug: slow-mountain-climbers
    name: Slow mountain climbers
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 2
    effectiveness: 3
    impact: low
    is_timed: true
    steps:
      - Start in a push-up position.
      - Step one knee in towards your chest, then step it back.
      - Repeat with the other leg.
    cues:
      - Hips stay level.
      - Step, don't hop.
    common_mistake: Lifting your hips high in the air.

  - slug: fast-step-ups
    name: Fast step-ups
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Step or stair
    difficulty: 2
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Stand facing a sturdy step or stair.
      - Step up with one foot, then the other, and step back down.
      - Keep going quickly for the set time.
    cues:
      - Use the whole foot on the step.
      - Pick up the pace once you're warm.
    common_mistake: Using a step that wobbles.

  - slug: inchworm
    name: Inchworm
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 2
    effectiveness: 3
    impact: low
    steps:
      - Stand tall, then bend forward and put your hands on the floor.
      - Walk your hands out until you're in a push-up position.
      - Walk your hands back to your feet and stand up.
    cues:
      - Bend your knees as much as you need.
      - Keep your stomach tight in the plank.
    common_mistake: Letting your hips sag when your hands are out front.

  - slug: bear-crawl-hold
    name: Bear crawl hold
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 3
    effectiveness: 3
    impact: low
    is_timed: true
    steps:
      - Kneel on all fours with your hands under your shoulders and knees under your hips.
      - Lift your knees just off the floor.
      - Hold for the set time.
    cues:
      - Back flat, knees hovering.
      - Breathe normally.
    common_mistake: Lifting your hips high to make it easier.

  - slug: mountain-climbers
    name: Mountain climbers
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 2
    effectiveness: 4
    impact: medium
    is_timed: true
    steps:
      - Start in a push-up position.
      - Drive one knee towards your chest, then switch legs quickly.
      - Keep switching for the set time.
    cues:
      - Hips stay level.
      - Hands under your shoulders.
    common_mistake: Bouncing your hips up and down.

  - slug: jumping-jacks
    name: Jumping jacks
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 3
    impact: medium
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Stand with your feet together and arms by your sides.
      - Jump your feet out wide while raising your arms overhead.
      - Jump back to the start.
    cues:
      - Land softly on the balls of your feet.
      - Keep a steady rhythm.
    common_mistake: Landing heavily on your heels.

  - slug: high-knees
    name: High knees
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 2
    effectiveness: 4
    impact: medium
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Stand tall.
      - Run on the spot, lifting your knees up to hip height.
      - Pump your arms and keep going for the set time.
    cues:
      - Stay on the balls of your feet.
      - Stand tall; don't lean back.
    common_mistake: Leaning back so your knees barely lift.

  - slug: butt-kicks
    name: Butt kicks
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 1
    effectiveness: 3
    impact: medium
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Stand tall.
      - Run on the spot, kicking your heels up towards your bottom.
      - Keep going for the set time.
    cues:
      - Stay light on your feet.
      - Pump your arms.
    common_mistake: Leaning forward as you run.

  - slug: skater-hops
    name: Skater hops
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 3
    effectiveness: 4
    impact: medium
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Stand on one leg with a slight bend in the knee.
      - Jump sideways onto the other leg, swinging the first leg behind you.
      - Jump back the other way.
    cues:
      - Land softly with a bent knee.
      - Start with small jumps.
    common_mistake: Landing with a straight, stiff leg.

  - slug: squat-thrust
    name: Squat thrust
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 3
    effectiveness: 4
    impact: medium
    not_suitable_for: [back]
    is_timed: true
    steps:
      - Stand tall, then squat down and put your hands on the floor.
      - Step or jump your feet back into a push-up position.
      - Step or jump your feet back to your hands.
      - Stand up.
    cues:
      - Keep your stomach tight in the push-up position.
      - Step instead of jumping to make it gentler.
    common_mistake: Letting your hips sag when your feet go back.

  - slug: jump-rope
    name: Jump rope
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Rope
    difficulty: 2
    effectiveness: 5
    impact: medium
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Hold the rope handles at your hips with the rope behind you.
      - Swing the rope over your head with your wrists.
      - Jump just high enough for the rope to pass under your feet.
    cues:
      - Small jumps on the balls of your feet.
      - Turn the rope with your wrists, not your arms.
    common_mistake: Jumping far too high.

  - slug: burpee
    name: Burpee
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 4
    effectiveness: 5
    impact: high
    not_suitable_for: [knees, back]
    is_timed: true
    steps:
      - Squat down and put your hands on the floor.
      - Jump your feet back into a push-up position and do a push-up.
      - Jump your feet back to your hands.
      - Jump up with your arms overhead.
    cues:
      - Land softly.
      - Keep your body straight in the push-up.
    common_mistake: Letting your hips sag in the push-up part.

  - slug: jump-squat
    name: Jump squat
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 3
    effectiveness: 4
    impact: high
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Stand with your feet shoulder-width apart.
      - Squat down, then jump up as high as you can.
      - Land softly and go straight into the next squat.
    cues:
      - Land on the balls of your feet and bend your knees.
      - Swing your arms to help the jump.
    common_mistake: Landing with straight legs.

  - slug: jump-lunge
    name: Jump lunge
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 4
    effectiveness: 4
    impact: high
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Start in a lunge position with one foot forward.
      - Jump up and switch legs in the air.
      - Land softly in a lunge with the other foot forward.
    cues:
      - Land softly with bent knees.
      - Keep your chest up.
    common_mistake: Landing so hard that your back knee hits the floor.

  - slug: tuck-jump
    name: Tuck jump
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    difficulty: 5
    effectiveness: 4
    impact: high
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Stand with your feet hip-width apart.
      - Jump up and pull your knees towards your chest.
      - Land softly and go straight into the next jump.
    cues:
      - Land softly with bent knees.
      - Only for experienced users.
    common_mistake: Landing on straight legs.

  - slug: sprints
    name: Sprints
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Outdoor space
    difficulty: 4
    effectiveness: 5
    impact: high
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Warm up well with a few minutes of jogging.
      - Run as fast as you safely can for the set time or distance.
      - Walk to recover, then repeat.
    cues:
      - Pump your arms.
      - Start at three-quarter speed for the first few.
    common_mistake: Sprinting flat out without a proper warm-up.

  - slug: brisk-walk
    name: Brisk walk
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Outdoor or treadmill
    difficulty: 1
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Walk at a pace where you can still talk but not sing.
      - Swing your arms naturally.
      - Keep going for the set time.
    cues:
      - Stand tall.
      - Pick up the pace a little once warm.
    common_mistake: Strolling so slowly that your breathing doesn't change.

  - slug: jog
    name: Jog
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Outdoor or treadmill
    difficulty: 2
    effectiveness: 4
    impact: medium
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Start with a few minutes of brisk walking.
      - Jog at a pace where you can still talk in short sentences.
      - Keep going for the set time.
    cues:
      - Short, light steps.
      - Relax your shoulders.
    common_mistake: Starting too fast and running out of breath early.

  - slug: run-intervals
    name: Run intervals
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Outdoor or treadmill
    difficulty: 4
    effectiveness: 5
    impact: high
    not_suitable_for: [knees]
    is_timed: true
    steps:
      - Warm up with a few minutes of easy jogging.
      - Run hard for the set time.
      - Walk or jog slowly to recover, then repeat.
    cues:
      - Hard means you can only say a word or two.
      - Keep the recovery easy.
    common_mistake: Running the hard parts so fast that you can't finish the session.

  - slug: cycling
    name: Cycling
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Bicycle or gym bike
    difficulty: 1
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Set the seat so your leg is almost straight at the bottom of the pedal.
      - Pedal at a steady pace for the set time.
      - Add short faster parts once you're warm.
    cues:
      - Keep your shoulders relaxed.
      - Steady breathing.
    common_mistake: Seat set too low, which strains the knees.

  - slug: stair-climbing
    name: Stair climbing
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    also_needs: Stairs
    difficulty: 2
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Walk up the stairs at a steady pace.
      - Walk back down slowly.
      - Repeat for the set time.
    cues:
      - Use the handrail on the way down.
      - Every step with your whole foot.
    common_mistake: Rushing down the stairs.

  - slug: exercise-bike
    name: Exercise bike
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Set the seat so your leg is almost straight at the bottom of the pedal.
      - Pedal at a steady pace for the set time.
      - Raise the resistance for harder parts.
    cues:
      - Sit tall.
      - Adjust the resistance, not just your speed.
    common_mistake: Seat set too low.

  - slug: elliptical
    name: Elliptical
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    equipment: [gym]
    also_needs: Machine
    difficulty: 1
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Step onto the pedals and hold the handles.
      - Move your legs and arms in a smooth, steady rhythm.
      - Keep going for the set time.
    cues:
      - Stand tall.
      - Push and pull with your arms too.
    common_mistake: Leaning heavily on the handles.

  - slug: rowing-machine
    name: Rowing machine
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    equipment: [gym]
    also_needs: Machine
    difficulty: 2
    effectiveness: 5
    impact: low
    not_suitable_for: [back]
    is_timed: true
    steps:
      - Strap your feet in and hold the handle with straight arms.
      - Push with your legs first, then lean back slightly, then pull the handle to your ribs.
      - Return in the opposite order; arms, body, then legs.
    cues:
      - Legs, body, arms on the way back; arms, body, legs on the way forward.
      - Most of the power comes from your legs.
    common_mistake: Pulling with your arms before your legs have pushed.

  - slug: stair-climber
    name: Stair climber
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    equipment: [gym]
    also_needs: Machine
    difficulty: 2
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Step onto the machine and hold the rails lightly.
      - Step steadily at a pace you can keep.
      - Keep going for the set time.
    cues:
      - Stand tall.
      - Use the rails for balance only.
    common_mistake: Leaning on the rails and taking your weight off your legs.

  - slug: battle-ropes
    name: Battle ropes
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    equipment: [gym]
    also_needs: Ropes
    difficulty: 3
    effectiveness: 4
    impact: low
    is_timed: true
    steps:
      - Hold one rope end in each hand and stand with your knees slightly bent.
      - Move your arms up and down quickly to make waves in the ropes.
      - Keep going for the set time.
    cues:
      - Stay low with a tight stomach.
      - Make the waves reach the anchor.
    common_mistake: Standing up straight and using only your wrists.

  - slug: sled-push
    name: Sled push
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    equipment: [gym]
    also_needs: Sled
    difficulty: 3
    effectiveness: 5
    impact: low
    is_timed: true
    steps:
      - Hold the sled handles with your arms straight and lean forward.
      - Drive the sled forward with short, powerful steps.
      - Push for the set distance, then rest.
    cues:
      - Keep your back flat.
      - Push through the balls of your feet.
    common_mistake: Standing too upright, so you can't push.

  - slug: kettlebell-swing
    name: Kettlebell swing
    category: cardio
    movement_slot: conditioning
    exercise_type: cardio
    equipment: [gym]
    also_needs: Kettlebell
    difficulty: 3
    effectiveness: 5
    impact: low
    not_suitable_for: [back]
    is_timed: true
    steps:
      - Stand with your feet a little wider than your shoulders and the kettlebell on the floor in front of you.
      - Push your hips back and hike the kettlebell back between your legs.
      - Snap your hips forward to swing it up to chest height.
      - Let it swing back down between your legs and repeat.
    cues:
      - Your hips do the work; your arms just hold on.
      - Stand tall and squeeze your bottom at the top.
    common_mistake: Squatting down and lifting the kettlebell with your arms.

  # ===================================================================================
  # MOBILITY
  # ===================================================================================

  # --- Warm-up -----------------------------------------------------------------------

  - slug: arm-circles
    name: Arm circles
    category: mobility
    movement_slot: warm_up
    exercise_type: mobility
    primary_muscle: shoulders
    difficulty: 1
    is_timed: true
    steps:
      - Stand tall with your arms straight out to the sides.
      - Make small circles, slowly making them bigger.
      - Switch direction halfway through.
    cues:
      - Keep your shoulders relaxed.
      - Move smoothly.
    common_mistake: Swinging the arms wildly from the start.

  - slug: cat-cow
    name: Cat-cow
    category: mobility
    movement_slot: warm_up
    exercise_type: mobility
    primary_muscle: back
    difficulty: 1
    is_timed: true
    steps:
      - Kneel on all fours with your hands under your shoulders.
      - Round your back up towards the ceiling and tuck your chin.
      - Slowly let your stomach drop and lift your chest and head.
      - Keep moving slowly between the two.
    cues:
      - Breathe out as you round, in as you arch.
      - Move slowly.
    common_mistake: Rushing through the movement.

  - slug: thoracic-rotation
    name: Thoracic rotation
    category: mobility
    movement_slot: warm_up
    exercise_type: mobility
    primary_muscle: back
    difficulty: 1
    steps:
      - Kneel on all fours and put one hand behind your head.
      - Turn your elbow down towards the opposite arm.
      - Turn it open up towards the ceiling, following it with your eyes.
      - Finish your reps, then switch sides.
    cues:
      - Keep your hips still.
      - Turn from your upper back.
    common_mistake: Twisting your hips instead of your upper back.

  - slug: hip-circles
    name: Hip circles
    category: mobility
    movement_slot: warm_up
    exercise_type: mobility
    primary_muscle: glutes
    difficulty: 1
    is_timed: true
    steps:
      - Stand with your hands on your hips and feet shoulder-width apart.
      - Draw big, slow circles with your hips.
      - Switch direction halfway through.
    cues:
      - Keep your knees soft.
      - Make the circles as big as feels comfortable.
    common_mistake: Moving your shoulders instead of your hips.

  - slug: leg-swings
    name: Leg swings
    category: mobility
    movement_slot: warm_up
    exercise_type: mobility
    primary_muscle: glutes
    secondary_muscles: [hamstrings]
    also_needs: Wall for balance
    difficulty: 1
    steps:
      - Stand side-on to a wall and hold it with one hand.
      - Swing your outside leg forward and back in a smooth, relaxed way.
      - Then face the wall and swing the leg side to side.
      - Switch legs.
    cues:
      - Start small and let the swings grow.
      - Stand tall.
    common_mistake: Kicking hard instead of swinging loosely.

  - slug: ankle-rocks
    name: Ankle rocks
    category: mobility
    movement_slot: warm_up
    exercise_type: mobility
    primary_muscle: calves
    difficulty: 1
    steps:
      - Kneel on one knee with the other foot flat in front of you.
      - Rock your front knee forward over your toes, keeping your heel down.
      - Rock back and repeat, then switch sides.
    cues:
      - Your heel stays on the floor.
      - Move slowly.
    common_mistake: Letting your heel lift.

  - slug: world-s-greatest-stretch
    name: World's greatest stretch
    category: mobility
    movement_slot: warm_up
    exercise_type: mobility
    primary_muscle: glutes
    secondary_muscles: [back, hamstrings]
    difficulty: 2
    steps:
      - Step into a long lunge and put both hands on the floor inside your front foot.
      - Drop your inside elbow towards the floor.
      - Turn your chest open and reach that arm up to the ceiling.
      - Put your hand back down and switch sides.
    cues:
      - Keep your back leg straight.
      - Breathe as you turn.
    common_mistake: Rushing through it without holding each position.

  # --- Cool-down ---------------------------------------------------------------------

  - slug: hamstring-stretch
    name: Hamstring stretch
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: hamstrings
    difficulty: 1
    is_timed: true
    steps:
      - Sit on the floor with one leg straight and the other foot against your inner thigh.
      - Lean forward over the straight leg until you feel a stretch behind the knee and thigh.
      - Hold for 20 to 30 seconds, then switch sides.
    cues:
      - Keep your back long; lean from the hips.
      - Breathe slowly.
    common_mistake: Rounding your back to reach your toes.

  - slug: quad-stretch
    name: Quad stretch
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: quads
    difficulty: 1
    is_timed: true
    steps:
      - Stand holding a wall and bend one knee to hold that ankle behind you.
      - Pull your heel gently towards your bottom.
      - Hold for 20 to 30 seconds, then switch sides.
    cues:
      - Keep your knees close together.
      - Squeeze your bottom for a bigger stretch.
    common_mistake: Arching your lower back.

  - slug: hip-flexor-stretch
    name: Hip flexor stretch
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: quads
    difficulty: 1
    is_timed: true
    steps:
      - Kneel on one knee with the other foot flat in front of you.
      - Tuck your hips under and squeeze the bottom of the back leg.
      - Shift your weight forward a little until you feel a stretch at the front of the back hip.
      - Hold for 20 to 30 seconds, then switch sides.
    cues:
      - Stay tall.
      - Small movement; the tuck does the work.
    common_mistake: Leaning far forward and arching your back.

  - slug: figure-four-glute-stretch
    name: Figure-four glute stretch
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: glutes
    difficulty: 1
    is_timed: true
    steps:
      - Lie on your back with your knees bent.
      - Cross one ankle over the opposite knee.
      - Pull the bottom leg towards your chest until you feel a stretch in your bottom.
      - Hold for 20 to 30 seconds, then switch sides.
    cues:
      - Keep your head on the floor.
      - Push the top knee away gently for more stretch.
    common_mistake: Lifting your head and shoulders off the floor.

  - slug: calf-stretch
    name: Calf stretch
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: calves
    also_needs: Wall
    difficulty: 1
    is_timed: true
    steps:
      - Stand facing a wall with your hands on it.
      - Step one foot back and keep that heel on the floor.
      - Lean into the wall until you feel a stretch in the back calf.
      - Hold for 20 to 30 seconds, then switch sides.
    cues:
      - Back leg straight, heel down.
      - Toes point forward.
    common_mistake: Letting the back heel lift.

  - slug: doorway-chest-stretch
    name: Doorway chest stretch
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: chest
    secondary_muscles: [shoulders]
    also_needs: Doorway
    difficulty: 1
    is_timed: true
    steps:
      - Stand in a doorway and put your forearm on the door frame at shoulder height.
      - Step forward and turn your body away until you feel a stretch across your chest.
      - Hold for 20 to 30 seconds, then switch sides.
    cues:
      - Keep your shoulder down.
      - Gentle stretch, never pain.
    common_mistake: Pushing so far that the front of the shoulder hurts.

  - slug: lat-stretch
    name: Lat stretch
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: back
    also_needs: Table or door frame
    difficulty: 1
    is_timed: true
    steps:
      - Hold a table edge or door frame with both hands.
      - Walk back and sit your hips back until your arms are straight and you feel a stretch under your arms.
      - Hold for 20 to 30 seconds.
    cues:
      - Let your chest sink towards the floor.
      - Breathe slowly.
    common_mistake: Rounding your back instead of reaching through your arms.

  - slug: child-s-pose
    name: Child's pose
    category: mobility
    movement_slot: cool_down
    exercise_type: mobility
    primary_muscle: back
    secondary_muscles: [glutes]
    difficulty: 1
    is_timed: true
    steps:
      - Kneel with your big toes together and knees apart.
      - Sit back on your heels and reach your arms forward on the floor.
      - Rest your forehead down and breathe slowly.
      - Hold for 20 to 30 seconds or longer.
    cues:
      - Let your body relax with each breath out.
      - Put a pillow under your hips if your knees are tight.
    common_mistake: Holding your breath.
