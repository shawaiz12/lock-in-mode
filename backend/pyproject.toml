[project]
name = "lock-in-mode-api"
version = "0.1.0"
description = "Backend API for Lock In Mode, a gamified fitness app."
readme = "README.md"
authors = [
    { name = "bruce18wayne", email = "shawaizsheikh030@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
lock-in-mode-api = "lock_in_mode_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]  # generated, already-applied history: never rewritten

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes: unused imports/variables, undefined names
    "I",     # import sorting (isort)
    "B",     # bugbear: likely bugs
    "UP",    # pyupgrade: modern Python syntax
    "SIM",   # simplifications
    "ASYNC", # async pitfalls (blocking calls in async code)
]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations/env.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
