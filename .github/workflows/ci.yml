name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button: re-run checks, and redeploy main (ADR 0028)

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres for this job only, same image as compose.yaml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lockin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lockin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Rate limiting tests use a real Redis too (ADR 0008), same image as compose.yaml.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # No .env in CI: pydantic-settings reads these environment variables instead.
    # The tests switch POSTGRES_DB to lockin_test themselves (see tests/conftest.py).
    env:
      POSTGRES_USER: lockin
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: lockin
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v

      # On Vercel the API reaches Supabase through its transaction pooler (ADR 0031): a
      # database connection is handed to another client after every transaction, and
      # prepared statements don't survive that. Prove it works that way, through PgBouncer
      # with 2 connections and no prepared statements: 20 users doing the real journey at
      # once (the API started from app.py, like Vercel), then many transactions in a row
      # on one connection (scripts/pooler_check.py).
      - name: Journey through a transaction pooler (like Vercel to Supabase)
        env:
          JWT_SECRET: ci-only-pooler-check-secret-not-used-anywhere-else
        run: |
          sudo apt-get install -y -q pgbouncer > /dev/null
          mkdir -p "$RUNNER_TEMP/pgb"
          printf '"lockin" "ci-only-password"\n' > "$RUNNER_TEMP/pgb/users.txt"
          cat > "$RUNNER_TEMP/pgb/pgbouncer.ini" <<EOF
          [databases]
          * = host=127.0.0.1 port=5432
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6433
          auth_type = scram-sha-256
          auth_file = $RUNNER_TEMP/pgb/users.txt
          pool_mode = transaction
          max_prepared_statements = 0
          default_pool_size = 2
          ignore_startup_parameters = extra_float_digits
          pidfile = $RUNNER_TEMP/pgb/pgbouncer.pid
          logfile = $RUNNER_TEMP/pgb/pgbouncer.log
          EOF
          pgbouncer -d "$RUNNER_TEMP/pgb/pgbouncer.ini"
          uv run alembic upgrade head
          uv run python -m lock_in_mode_api.seed
          # From here on, the API and the check both go through the pooler.
          export POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=6433 POSTGRES_TRANSACTION_POOLER=true
          TRUSTED_PROXY_HOPS=1 ACCOUNT_CLEANUP_INTERVAL_SECONDS=0 \
            uv run uvicorn app:app --port 8077 > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8077/health/live > /dev/null && break
            sleep 1
          done
          uv run python scripts/pooler_check.py http://127.0.0.1:8077 20 \
            || { cat "$RUNNER_TEMP/api.log"; exit 1; }

      - name: Build API Docker image
        working-directory: .
        run: docker build --build-arg APP_VERSION=ci-check --tag lock-in-mode-api:ci backend

      # What the hosting platform runs (ADR 0028): the start script is in the image and
      # parses, and the build's commit id reaches the app.
      - name: Check the image is ready to host
        working-directory: .
        run: |
          docker run --rm lock-in-mode-api:ci sh -n start-production.sh
          test "$(docker run --rm lock-in-mode-api:ci printenv APP_VERSION)" = "ci-check"

  mobile:
    name: Mobile app (types, lint, tests, API types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      # The app's API types (src/api/schema.d.ts) must match the API in the same commit
      # (ADR 0029). The schema comes from the backend code itself: no server, no database.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: API types match the API
        env:
          POSTGRES_USER: unused
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: unused
          JWT_SECRET: ci-only-openapi-export-secret-not-used-anywhere
        run: |
          (cd ../backend && uv run --locked python -c \
            "import json; from lock_in_mode_api.main import app; print(json.dumps(app.openapi()))") \
            > "$RUNNER_TEMP/openapi.json"
          npm run api:types -- --from "$RUNNER_TEMP/openapi.json" --check

  # Main only, after the tests pass (ADR 0031): bring the database up to date, deploy
  # this exact commit to Vercel, then wait until the live API reports it. Skipped until
  # the repository variables exist (docs/deploy.md), so forks and the time before
  # hosting stay green.
  deploy:
    name: Deploy API
    needs: backend
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # One deploy at a time, in push order; a newer push waits rather than cancelling.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Before the deploy, so the new code never meets an old schema. Migrations stay
      # backwards compatible (ADR 0028): the version still live keeps working meanwhile.
      - name: Update the database and the exercise library
        working-directory: backend
        env:
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: "5432" # Supabase's session pooler: a migration needs one whole session
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: verify-full
          POSTGRES_SSL_ROOT_CERT: ${{ vars.POSTGRES_SSL_ROOT_CERT }}
        run: |
          # The settings insist on a JWT secret; migrations never sign anything.
          export JWT_SECRET="$(openssl rand -hex 32)"
          uv sync --locked --no-dev
          uv run --no-sync alembic upgrade head
          uv run --no-sync python -m lock_in_mode_api.seed

      # From the repo root: the Vercel project's Root Directory is backend/, and
      # .vercelignore keeps everything else (and any .env) out of the upload.
      - name: Deploy this commit to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: >-
          npx --yes vercel@66 deploy --prod --yes --token "$VERCEL_TOKEN"
          --env APP_VERSION="$GITHUB_SHA"

      - name: Wait until the live API runs this commit
        run: |
          # The deploy command waits for the build; the new version is usually live at
          # once. Give it 5 minutes.
          for attempt in $(seq 1 30); do
            live=$(curl --silent --max-time 10 "$API_URL/health/live" || true)
            if [ "$(echo "$live" | jq -r '.version // empty' 2>/dev/null)" = "$GITHUB_SHA" ]; then
              echo "Live: $live"
              # The full check also proves the API reaches the database.
              curl --fail --silent --show-error --max-time 30 "$API_URL/health"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The API at $API_URL never reported version $GITHUB_SHA. Check the deployment's logs on Vercel."
          exit 1
